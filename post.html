<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Post — AIAD</title>
  <meta name="description" content="A post on AIAD." />
  <meta property="og:title" content="Post on AIAD" />
  <meta property="og:description" content="See this post on AIAD — Artist Intelligence & Development." />
  <meta property="og:type" content="article" />
  <meta name="twitter:card" content="summary_large_image" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --teal-light:#00D4FF;--teal:#00B4D8;--teal-dark:#0077B6;--magenta:#d946ef;
      --bg:#0A0A0A;--bg-2:#101013;--bg-card:#161616;
      --text:#FFFFFF;--text-2:rgba(255,255,255,0.62);--text-muted:rgba(255,255,255,0.42);
      --border:rgba(255,255,255,0.08);
      --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:rgba(10,10,10,0.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.02em}
    .brand .dot{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--magenta))}
    .cta{font-size:13px;color:var(--text-2)}
    .wrap{max-width:560px;margin:0 auto;padding:26px 18px 80px}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
    .head{display:flex;align-items:center;gap:12px;padding:16px}
    .av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#12141d}
    .av-fallback{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--magenta))}
    .who{min-width:0}
    .nm{font-weight:600;font-size:1rem;display:flex;align-items:center;gap:5px}
    .hn{color:var(--text-muted);font-size:0.82rem}
    .media{width:100%;background:#000;display:block}
    .media img,.media video{width:100%;max-height:640px;object-fit:contain;background:#000;display:block}
    .cap{padding:16px;font-size:0.95rem;line-height:1.55;white-space:pre-wrap}
    .time{padding:0 16px 18px;color:var(--text-muted);font-size:0.78rem}
    .foot{max-width:560px;margin:22px auto 0;text-align:center}
    .foot a{display:inline-block;padding:11px 22px;border-radius:999px;background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;font-weight:600;font-size:0.9rem}
    .state{max-width:560px;margin:80px auto;text-align:center;color:var(--text-muted);padding:0 20px}
    .verified{width:15px;height:15px;color:var(--teal-light)}
  </style>
</head>
<body>
  <div class="nav">
    <a class="brand" href="/"><span class="dot"></span> AIAD</a>
    <a class="cta" href="/">Artist Intelligence &amp; Development →</a>
  </div>
  <div id="root"><div class="state">Loading post…</div></div>

  <script>
    const SUPABASE_URL = 'https://uapiytquwuhtewqieegx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcGl5dHF1d3VodGV3cWllZWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NzcwMTksImV4cCI6MjA4OTI1MzAxOX0.BLs2RdStghm0_cF8t70cBTX1GWcowGRwID7TAG8Mg38';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
    const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    function timeAgo(iso) {
      try {
        const d = new Date(iso), s = Math.floor((Date.now() - d) / 1000);
        if (s < 60) return 'just now';
        const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
        const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
        const dd = Math.floor(h / 24); if (dd < 7) return dd + 'd ago';
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) { return ''; }
    }
    function checkSvg() {
      return '<svg class="verified" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 1.8 3 .1 1 2.8 2.4 1.8-.9 2.9.9 2.9-2.4 1.8-1 2.8-3 .1L12 22l-2.4-1.8-3-.1-1-2.8L3.2 15.5l.9-2.9-.9-2.9 2.4-1.8 1-2.8 3-.1z"/><path d="M9 12l2 2 4-4" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    async function load() {
      const root = document.getElementById('root');
      const id = (location.pathname.split('/post/')[1] || '').split(/[/?#]/)[0];
      if (!id) { root.innerHTML = '<div class="state">Post not found.</div>'; return; }
      let p = null;
      try {
        const { data } = await db.rpc('public_post', { p_id: id });
        p = data;
      } catch (e) {}
      if (!p || !p.id) {
        root.innerHTML = '<div class="state">This post isn\'t available.<br><br><a style="color:var(--teal-light)" href="/">Go to AIAD →</a></div>';
        return;
      }
      const name = p.display_name || p.username || 'Artist';
      const avatar = p.avatar_url
        ? '<img class="av" src="' + esc(p.avatar_url) + '" alt="">'
        : '<div class="av av-fallback">' + esc((name[0] || '?').toUpperCase()) + '</div>';
      let media = '';
      if (p.media_url) {
        media = (p.media_type === 'video')
          ? '<div class="media"><video src="' + esc(p.media_url) + '" controls playsinline></video></div>'
          : '<div class="media"><img src="' + esc(p.media_url) + '" alt=""></div>';
      }
      const cap = p.content ? '<div class="cap">' + esc(p.content) + '</div>' : '';
      root.innerHTML =
        '<div class="wrap"><div class="card">'
        + '<a class="head" href="/artist/' + esc(p.username) + '">' + avatar
        + '<div class="who"><div class="nm">' + esc(name) + (p.verified ? checkSvg() : '') + '</div>'
        + '<div class="hn">@' + esc(p.username) + '</div></div></a>'
        + media + cap
        + '<div class="time">' + timeAgo(p.created_at) + '</div>'
        + '</div>'
        + '<div class="foot"><a href="/artist/' + esc(p.username) + '">View ' + esc(name) + ' on AIAD</a></div>'
        + '</div>';
      document.title = name + ' on AIAD';
    }
    load();
  </script>
</body>
</html>
