<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Store — AIAD</title>
    <meta name="description" content="Shop official merch and releases on AIAD." />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root{
        --teal-light:#00D4FF;--teal:#00B4D8;--teal-dark:#0077B6;--magenta:#d946ef;
        --bg:#0A0A0A;--bg-2:#101013;--bg-card:#161616;
        --text:#FFFFFF;--text-2:rgba(255,255,255,0.62);--text-muted:rgba(255,255,255,0.42);
        --border:rgba(255,255,255,0.08);--border-2:rgba(255,255,255,0.14);
        --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      }
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
      a{color:inherit;text-decoration:none}
      img{display:block;max-width:100%}
      /* Nav */
      .store-nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
        gap:16px;padding:14px 24px;background:rgba(10,10,10,0.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
      .nav-brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px;letter-spacing:.02em;min-width:0}
      .nav-brand .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--bg-card);flex-shrink:0;
        display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);border:1px solid var(--border)}
      .nav-brand .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .nav-mid{display:flex;gap:22px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
      .nav-mid a:hover{color:var(--text)}
      .nav-right{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text-2)}
      .nav-right a:hover{color:var(--text)}
      .nav-right .aiad{display:flex;align-items:center;gap:6px;color:var(--text-muted)}
      @media(max-width:640px){.nav-mid{display:none}.store-nav{padding:12px 16px}}
      /* Hero */
      .hero{max-width:1200px;margin:0 auto;padding:56px 24px 30px;text-align:center}
      .hero .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
      .hero h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;letter-spacing:-0.02em;line-height:1.02}
      .hero .tag{margin-top:12px;color:var(--text-2);font-size:15px;max-width:560px;margin-left:auto;margin-right:auto}
      /* Filters */
      .filters{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:8px 24px 34px}
      .filters button{background:transparent;color:var(--text-2);border:1px solid var(--border-2);border-radius:999px;
        padding:8px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
      .filters button:hover{color:var(--text)}
      .filters button.active{background:var(--text);color:#000;border-color:var(--text)}
      /* Grid */
      .grid{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:grid;
        grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 20px}
      .card{cursor:pointer;display:flex;flex-direction:column}
      .card .imgwrap{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--bg-card);border:1px solid var(--border)}
      .card .imgwrap img{width:100%;height:100%;object-fit:contain;transition:transform .5s ease}
      .card:hover .imgwrap img{transform:scale(1.045)}
      .card .badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
        color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:6px;font-weight:600}
      .card .soldout{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        background:rgba(10,10,10,0.55);color:#fff;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
      .card .imgempty{width:100%;height:100%;background:linear-gradient(135deg,#0d2f3f,#1a1030)}
      .card .nm{margin-top:12px;font-size:15px;font-weight:600;letter-spacing:.01em}
      .card .kd{margin-top:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
      .card .pr{margin-top:6px;font-size:14px;color:var(--text-2)}
      .empty{max-width:1200px;margin:0 auto;padding:60px 24px 100px;text-align:center;color:var(--text-muted);font-size:15px}
      /* Footer */
      .store-foot{border-top:1px solid var(--border);padding:26px 24px 42px;display:flex;flex-wrap:wrap;gap:12px 20px;
        align-items:center;justify-content:center;color:var(--text-muted);font-size:12.5px}
      .store-foot a{color:var(--text-2)}.store-foot a:hover{color:var(--text)}
      /* Product modal */
      .ov{position:fixed;inset:0;z-index:60;background:rgba(4,4,7,0.82);backdrop-filter:blur(8px);
        display:none;align-items:center;justify-content:center;padding:20px}
      .ov.open{display:flex}
      .sheet{background:var(--bg-2);border:1px solid var(--border);border-radius:18px;width:100%;max-width:920px;
        max-height:92vh;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr}
      @media(max-width:760px){.sheet{grid-template-columns:1fr;max-height:94vh}}
      .sheet .gallery{padding:16px}
      .sheet .main-img{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--bg-card);border:1px solid var(--border)}
      .sheet .main-img img{width:100%;height:100%;object-fit:contain}
      .sheet .thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
      .sheet .thumbs img{width:56px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border);opacity:.7}
      .sheet .thumbs img.sel,.sheet .thumbs img:hover{opacity:1;border-color:var(--text)}
      .sheet .info{padding:26px 26px 26px 8px;display:flex;flex-direction:column}
      @media(max-width:760px){.sheet .info{padding:6px 20px 24px}}
      .sheet .cls{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--text-2);font-size:26px;line-height:1;cursor:pointer}
      .sheet h2{font-size:1.5rem;font-weight:700;letter-spacing:-0.01em}
      .sheet .p-kind{margin-top:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
      .sheet .p-price{margin-top:14px;font-size:1.35rem;font-weight:700}
      .sheet .p-desc{margin-top:14px;color:var(--text-2);font-size:14px;line-height:1.6;white-space:pre-wrap}
      .sheet .p-details{margin-top:14px;display:flex;flex-direction:column;gap:6px}
      .sheet .p-details .row{display:flex;justify-content:space-between;gap:16px;font-size:13px;border-top:1px solid var(--border);padding-top:6px}
      .sheet .p-details .row .k{color:var(--text-muted)}
      .sheet .p-details .row .v{color:var(--text-2);text-align:right}
      .sheet .p-opts{margin-top:16px}
      .sheet .p-opt-group{margin-top:12px}
      .sheet .p-opt-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px}
      .sheet .chips{display:flex;flex-wrap:wrap;gap:8px}
      .sheet .chip{border:1px solid var(--border-2);background:transparent;color:var(--text);border-radius:8px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit}
      .sheet .chip.sel{background:var(--text);color:#000;border-color:var(--text)}
      .sheet .p-stock{margin-top:10px;font-size:12px;color:var(--text-muted)}
      .qtyrow{display:flex;align-items:center;gap:12px;margin-top:20px}
      .qtyrow .qbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-2);background:transparent;color:#fff;font-size:18px;cursor:pointer}
      .qtyrow .qv{min-width:26px;text-align:center;font-size:15px}
      .buy{margin-top:20px;width:100%;background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;
        border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
      .buy:disabled{opacity:.55;cursor:not-allowed}
      .buy-note{margin-top:10px;font-size:12px;color:var(--text-muted);text-align:center;min-height:14px}
      /* Bag button + drawer */
      .bagbtn{position:relative;display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--border-2);
        border-radius:999px;padding:7px 15px;color:var(--text);font-family:inherit;font-size:12px;letter-spacing:.06em;
        text-transform:uppercase;font-weight:600;cursor:pointer}
      .bagbtn:hover{border-color:var(--text)}
      .bagbtn .cnt{min-width:18px;height:18px;border-radius:999px;background:var(--teal-light);color:#001018;font-size:11px;
        font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px;letter-spacing:0}
      .bagbtn.has .cnt{display:flex}
      .drawer{position:fixed;inset:0;z-index:70;display:none}
      .drawer.open{display:block}
      .drawer .scrim{position:absolute;inset:0;background:rgba(4,4,7,0.72);backdrop-filter:blur(6px)}
      .drawer .panel{position:absolute;top:0;right:0;height:100%;width:100%;max-width:420px;background:var(--bg-2);
        border-left:1px solid var(--border);display:flex;flex-direction:column}
      .drawer .dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--border)}
      .drawer .dhead h2{font-size:1.05rem;font-weight:700}
      .drawer .dhead button{background:none;border:none;color:var(--text-2);font-size:26px;line-height:1;cursor:pointer}
      .drawer .dbody{flex:1;overflow:auto;padding:4px 22px 14px}
      .drawer .dfoot{padding:18px 22px 22px;border-top:1px solid var(--border)}
      .bagline{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
      .bagline .th{width:58px;height:72px;border-radius:8px;object-fit:cover;background:var(--bg-card);
        border:1px solid var(--border);flex-shrink:0}
      .bagline .mid{flex:1;min-width:0}
      .bagline .nm{font-size:13px;font-weight:600;line-height:1.35}
      .bagline .vr{margin-top:3px;font-size:11px;color:var(--text-muted)}
      .bagline .ctl{margin-top:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
      .bagline .ctl button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border-2);background:transparent;
        color:#fff;font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
      .bagline .ctl .q{min-width:20px;text-align:center;font-size:13px}
      .bagline .ctl .rm{width:auto;padding:0 9px;height:26px;font-size:10px;color:var(--text-muted);border-color:transparent;
        text-transform:uppercase;letter-spacing:.07em}
      .bagline .ctl .rm:hover{color:var(--text)}
      .bagline .lt{font-size:13px;font-weight:600;white-space:nowrap}
      .bagnote{margin:12px 0 0;padding:9px 12px;border:1px solid var(--border-2);border-radius:9px;
        font-size:11px;color:var(--text-muted);line-height:1.5}
      .subtot{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text-2);margin-bottom:14px}
      .subtot .v{font-size:1.15rem;font-weight:700;color:var(--text)}
      .bagempty{padding:54px 0;text-align:center;color:var(--text-muted);font-size:14px;line-height:1.7}
      .ghost{margin-top:10px;width:100%;background:transparent;border:1px solid var(--border-2);color:var(--text);
        border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
      .ghost:hover{border-color:var(--text)}
      /* Receipt (the return from Stripe) */
      .rsheet{position:relative;background:var(--bg-2);border:1px solid var(--border);border-radius:18px;width:100%;max-width:460px;
        padding:30px 26px 26px;text-align:center;max-height:90vh;overflow:auto}
      .rsheet .cls{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-2);font-size:26px;line-height:1;cursor:pointer}
      .rsheet .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}
      .rsheet h2{margin-top:10px;font-size:1.4rem;font-weight:700;letter-spacing:-0.01em}
      .rsheet .rc-msg{margin-top:12px;color:var(--text-2);font-size:14px;line-height:1.6}
      .rsheet .rc-lines{margin-top:18px;display:flex;flex-direction:column;gap:7px;text-align:left}
      .rsheet .rc-lines .row{display:flex;justify-content:space-between;gap:16px;font-size:13px;border-top:1px solid var(--border);padding-top:7px}
      .rsheet .rc-lines .row .k{color:var(--text-muted)}
      .rsheet .rc-lines .row .v{color:var(--text-2);text-align:right}
      .rsheet .buy{display:block;text-align:center}
      .rsheet .rc-note{margin-top:9px;font-size:11px;color:var(--text-muted)}
      .state{max-width:640px;margin:0 auto;padding:100px 24px;text-align:center;color:var(--text-muted);font-size:15px}
      .state a{color:var(--teal-light)}
    </style>
</head>
<body>
    <nav class="store-nav">
      <a class="nav-brand" id="navBrand" href="#"><span class="av" id="navAv"></span><span class="nm" id="navName">Store</span></a>
      <div class="nav-mid"><a href="#" id="navShop">Shop</a></div>
      <div class="nav-right">
        <a id="navProfile" href="#">Profile</a>
        <button class="bagbtn" id="bagBtn">Bag <span class="cnt" id="bagCount">0</span></button>
        <a class="aiad" href="/">Powered by AIAD</a>
      </div>
    </nav>

    <div id="root">
      <div class="state">Loading store…</div>
    </div>

    <!-- Product quick-view -->
    <div class="ov" id="ov">
      <div class="sheet" style="position:relative">
        <button class="cls" id="ovClose" aria-label="Close">&times;</button>
        <div class="gallery">
          <div class="main-img"><img id="ovMain" src="" alt=""></div>
          <div class="thumbs" id="ovThumbs"></div>
        </div>
        <div class="info">
          <h2 id="ovName"></h2>
          <div class="p-price" id="ovPrice"></div>
          <div class="p-desc" id="ovDesc"></div>
          <div class="p-details" id="ovDetails"></div>
          <div class="p-opts" id="ovOptions"></div>
          <div class="qtyrow" id="ovQtyRow" style="display:none">
            <button class="qbtn" id="qMinus">−</button>
            <span class="qv" id="qVal">1</span>
            <button class="qbtn" id="qPlus">+</button>
          </div>
          <button class="buy" id="ovBuy">Add to bag</button>
          <button class="ghost" id="ovKeep">Continue shopping</button>
          <div class="buy-note" id="ovNote"></div>
        </div>
      </div>
    </div>

    <!-- Bag -->
    <div class="drawer" id="bag">
      <div class="scrim" id="bagScrim"></div>
      <div class="panel">
        <div class="dhead"><h2>Your bag</h2><button id="bagClose" aria-label="Close">&times;</button></div>
        <div class="dbody" id="bagBody"></div>
        <div class="dfoot" id="bagFoot"></div>
      </div>
    </div>

    <!-- Receipt: where Stripe drops a guest back -->
    <div class="ov" id="rc">
      <div class="rsheet">
        <button class="cls" id="rcClose" aria-label="Close">&times;</button>
        <div class="eyebrow" id="rcEyebrow">Order</div>
        <h2 id="rcTitle"></h2>
        <div class="rc-msg" id="rcMsg"></div>
        <div class="rc-lines" id="rcLines"></div>
        <div id="rcDownloads"></div>
        <div class="rc-note" id="rcNote"></div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = 'https://uapiytquwuhtewqieegx.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcGl5dHF1d3VodGV3cWllZWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NzcwMTksImV4cCI6MjA4OTI1MzAxOX0.BLs2RdStghm0_cF8t70cBTX1GWcowGRwID7TAG8Mg38';
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });

      const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])));

      function getUsername() {
        const parts = location.pathname.split('/').filter(Boolean);
        const i = parts.indexOf('store');
        if (i !== -1 && parts[i + 1]) return decodeURIComponent(parts[i + 1]);
        return new URLSearchParams(location.search).get('u') || '';
      }
      function fmtMoney(amt, cur) {
        const n = Number(amt);
        if (!Number.isFinite(n)) return '';
        try { return n.toLocaleString(undefined, { style:'currency', currency:(cur||'usd').toUpperCase() }); }
        catch (e) { return '$' + n.toFixed(2); }
      }
      function storedSession() {
        const key = 'sb-uapiytquwuhtewqieegx-auth-token';
        for (const store of [window.localStorage, window.sessionStorage]) {
          try {
            const raw = store.getItem(key); if (!raw) continue;
            const p = JSON.parse(raw);
            const t = p?.access_token || p?.currentSession?.access_token;
            if (t) return t;
          } catch (e) {}
        }
        return null;
      }
      const imagesOf = (pr) => (Array.isArray(pr.images) && pr.images.length) ? pr.images : (pr.image_url ? [pr.image_url] : []);

      let PROFILE = null, PRODUCTS = [], FILTER = 'all', CUR = null, QTY = 1;

      function notFound(u) {
        document.getElementById('root').innerHTML =
          `<div class="state">No store found for <strong>@${esc(u)}</strong>.<br/><br/><a href="/">← Back to AIAD</a></div>`;
      }

      const STORE_CATEGORIES = ['T-Shirts','Hoodies & Sweats','Hats & Beanies','Jackets & Outerwear','Bottoms','Footwear','Accessories','Luxury','Basics','Vinyl & Music','Digital','Other'];
      function categoriesPresent() {
        const set = new Set();
        PRODUCTS.forEach(p => { const c = (p.category || '').trim(); if (c) set.add(c); });
        return [...set].sort((a, b) => {
          const ia = STORE_CATEGORIES.indexOf(a), ib = STORE_CATEGORIES.indexOf(b);
          return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        });
      }

      function render() {
        const p = PROFILE;
        const name = p.display_name || ('@' + p.username);
        const storeTitle = (p.store_title && p.store_title.trim()) || name;
        // nav
        document.getElementById('navName').textContent = storeTitle;
        const av = document.getElementById('navAv');
        if (p.avatar_url) { av.innerHTML = `<img src="${esc(p.avatar_url)}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`; }
        else { av.textContent = name.charAt(0).toUpperCase(); }
        document.getElementById('navBrand').href = '/artist/' + encodeURIComponent(p.username);
        document.getElementById('navProfile').href = '/artist/' + encodeURIComponent(p.username);
        document.getElementById('navShop').href = '#';
        document.title = `${storeTitle} — Store`;

        const cats = categoriesPresent();
        const tabs = ['<button data-f="all" class="active">All</button>'].concat(cats.map((c) => `<button data-f="${esc(c)}">${esc(c)}</button>`));
        const filtersHtml = (cats.length >= 2) ? `<div class="filters">${tabs.join('')}</div>` : '';

        document.getElementById('root').innerHTML = `
          <header class="hero">
            <div class="eyebrow">Official Store</div>
            <h1>${esc(storeTitle)}</h1>
          </header>
          ${filtersHtml}
          <div id="gridHost"></div>
          <footer class="store-foot">
            <span>© 2026 AIAD Studio Inc.</span>
            <a href="/about">About</a><a href="/contact">Contact</a>
            <a href="/privacy">Privacy</a><a href="/terms">Terms</a>
            <a href="/artist/${encodeURIComponent(p.username)}">← ${esc(name)} profile</a>
          </footer>`;

        document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
          FILTER = b.dataset.f;
          document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
          renderGrid();
        }));
        renderGrid();
      }

      function visibleProducts() {
        if (FILTER === 'all') return PRODUCTS;
        return PRODUCTS.filter(p => (p.category || '') === FILTER);
      }

      function renderGrid() {
        const host = document.getElementById('gridHost');
        const rows = visibleProducts();
        if (!rows.length) { host.innerHTML = `<div class="empty">Nothing here yet — check back soon.</div>`; return; }
        host.innerHTML = `<div class="grid">${rows.map((pr, i) => {
          const imgs = imagesOf(pr);
          const soldOut = pr.product_kind === 'physical' && pr.inventory !== null && pr.inventory !== undefined && pr.inventory <= 0;
          const cover = imgs.length ? `<img src="${esc(imgs[0])}" alt="${esc(pr.name)}" loading="lazy">` : `<div class="imgempty"></div>`;
          return `<div class="card" data-i="${PRODUCTS.indexOf(pr)}">
            <div class="imgwrap">${cover}
              ${imgs.length > 1 ? `<span class="badge">${imgs.length} photos</span>` : ''}
              ${soldOut ? `<div class="soldout">Sold out</div>` : ''}
            </div>
            <div class="nm">${esc(pr.name)}</div>
            <div class="pr">${fmtMoney(pr.price, pr.currency)}</div>
          </div>`;
        }).join('')}</div>`;
        host.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => openProduct(PRODUCTS[+c.dataset.i])));
      }

      // ── The bag ──────────────────────────────────────────────────
      // ONE BAG, ONE SELLER. A Stripe direct charge lands on a single connected
      // account and one Checkout Session cannot be split across two, so a bag
      // spanning two artists could not be paid for at all. The bag therefore
      // remembers which store filled it, and adding from a different store offers to
      // start over rather than quietly mixing the two.
      //
      // localStorage is per-origin and can throw outright in a private window, so
      // every read and write is wrapped and the storefront still works without it —
      // the bag just stops surviving a reload.
      const CART_KEY = 'aiad_cart_v1';
      const MAX_LINES = 8;

      const emptyCart = () => ({ username: null, artist_id: null, items: [] });
      let CART = emptyCart();

      function loadCart() {
        try {
          const raw = localStorage.getItem(CART_KEY);
          if (!raw) return emptyCart();
          const c = JSON.parse(raw);
          if (!c || !Array.isArray(c.items)) return emptyCart();
          return {
            username: c.username || null,
            artist_id: c.artist_id || null,
            items: c.items.filter((it) => it && it.product_id).slice(0, MAX_LINES).map((it) => ({
              product_id: String(it.product_id),
              name: String(it.name || 'Item'),
              price: Number(it.price) || 0,
              currency: it.currency || 'usd',
              image: it.image || null,
              product_kind: it.product_kind || 'physical',
              size: it.size || null,
              color: it.color || null,
              quantity: Math.max(1, parseInt(it.quantity, 10) || 1),
            })),
          };
        } catch (e) { return emptyCart(); }
      }
      function saveCart(c) {
        CART = c;
        try {
          if (!c.items.length) localStorage.removeItem(CART_KEY);
          else localStorage.setItem(CART_KEY, JSON.stringify(c));
        } catch (e) {}
        paintBagCount();
      }
      const bagUnits = () => CART.items.reduce((n, it) => n + (Number(it.quantity) || 1), 0);
      function paintBagCount() {
        const btn = document.getElementById('bagBtn'); if (!btn) return;
        const n = bagUnits();
        document.getElementById('bagCount').textContent = String(n);
        btn.classList.toggle('has', n > 0);
      }

      // One file is one file, so a digital line never goes past 1. A physical product
      // with null inventory is untracked rather than sold out.
      function maxQtyFor(pr) {
        if (!pr) return 1;
        if (pr.product_kind === 'digital') return 1;
        if (pr.inventory === null || pr.inventory === undefined) return 99;
        return Math.max(0, Number(pr.inventory) || 0);
      }
      const variantOf = (it) =>
        [it.size ? 'Size: ' + it.size : '', it.color ? 'Color: ' + it.color : ''].filter(Boolean).join('  ·  ');
      const lineTotal = (it) => (Number(it.price) || 0) * (Number(it.quantity) || 1);
      const bagSubtotal = () => CART.items.reduce((s, it) => s + lineTotal(it), 0);

      function addToBag(pr, sel, qty) {
        const note = document.getElementById('ovNote');
        if (CART.items.length && CART.artist_id && CART.artist_id !== PROFILE.id) {
          const other = CART.username ? '@' + CART.username : 'another store';
          const ok = confirm('Your bag has items from ' + other + ". A bag can only hold one store's items. Start a new bag for @" + PROFILE.username + '?');
          if (!ok) return false;
          CART = emptyCart();
        }
        CART.username = PROFILE.username;
        CART.artist_id = PROFILE.id;

        const cap = maxQtyFor(pr);
        if (cap <= 0) { note.textContent = 'That one is sold out.'; return false; }

        const size = sel.size || null, color = sel.color || null;
        // The same product in the same size and colour is one line, not two.
        const line = CART.items.find((it) =>
          it.product_id === pr.id && (it.size || null) === size && (it.color || null) === color);
        if (line) {
          const want = (Number(line.quantity) || 1) + qty;
          if (want > cap) {
            note.textContent = pr.product_kind === 'digital'
              ? 'That download is already in your bag.'
              : 'Only ' + cap + ' available, and your bag already has ' + line.quantity + '.';
            return false;
          }
          line.quantity = want;
        } else {
          if (CART.items.length >= MAX_LINES) {
            note.textContent = 'A bag holds ' + MAX_LINES + ' different items. Check out, then start another.';
            return false;
          }
          // Say so rather than quietly trimming the quantity: someone who asked for
          // more than exists should be told, not handed a different order. The
          // stepper above already stops short of this, so it is the safety net.
          if (qty > cap) {
            note.textContent = pr.product_kind === 'digital'
              ? 'Digital items come one to a bag.'
              : 'Only ' + cap + ' available.';
            return false;
          }
          CART.items.push({
            product_id: pr.id, name: pr.name, price: Number(pr.price) || 0,
            currency: pr.currency || 'usd', image: imagesOf(pr)[0] || null,
            product_kind: pr.product_kind, size, color, quantity: qty,
          });
        }
        saveCart(CART);
        return true;
      }

      function openBag() { renderBag(); document.getElementById('bag').classList.add('open'); }
      function closeBag() { document.getElementById('bag').classList.remove('open'); }

      function renderBag() {
        const body = document.getElementById('bagBody');
        const foot = document.getElementById('bagFoot');
        if (!CART.items.length) {
          body.innerHTML = '<div class="bagempty">Your bag is empty.<br/>Tap anything in the store to add it.</div>';
          foot.innerHTML = '<button class="ghost" id="bagKeep" style="margin-top:0">Keep shopping</button>';
          wireBag();
          return;
        }
        const cur = CART.items[0].currency || 'usd';
        // The bag survives moving between storefronts, so say plainly whose it is when
        // it isn't this one's — the checkout still goes to that seller.
        const foreign = (PROFILE && CART.username && CART.username !== PROFILE.username)
          ? '<div class="bagnote">These items are from @' + esc(CART.username) + '. Checking out sends you to that store’s payment page.</div>'
          : '';
        body.innerHTML = foreign + CART.items.map((it, i) => {
          const vr = variantOf(it);
          const thumb = it.image ? '<img class="th" src="' + esc(it.image) + '" alt="">' : '<div class="th"></div>';
          const ctl = it.product_kind === 'digital'
            ? '<span class="vr">Digital · 1 copy</span>'
            : '<button data-dec="' + i + '" aria-label="One fewer">−</button>'
              + '<span class="q">' + esc(it.quantity) + '</span>'
              + '<button data-inc="' + i + '" aria-label="One more">+</button>';
          return '<div class="bagline">' + thumb
            + '<div class="mid"><div class="nm">' + esc(it.name) + '</div>'
            + (vr ? '<div class="vr">' + esc(vr) + '</div>' : '')
            + '<div class="ctl">' + ctl + '<button class="rm" data-rm="' + i + '">Remove</button></div></div>'
            + '<div class="lt">' + fmtMoney(lineTotal(it), it.currency) + '</div></div>';
        }).join('');
        foot.innerHTML =
          '<div class="subtot"><span>Subtotal</span><span class="v">' + fmtMoney(bagSubtotal(), cur) + '</span></div>'
          + '<button class="buy" id="bagCheckout" style="margin-top:0">Checkout</button>'
          + '<button class="ghost" id="bagKeep">Keep shopping</button>'
          + '<div class="buy-note" id="bagNote"></div>';
        wireBag();
      }

      function wireBag() {
        const body = document.getElementById('bagBody');
        body.querySelectorAll('[data-inc]').forEach((b) => b.addEventListener('click', () => changeQty(+b.dataset.inc, 1)));
        body.querySelectorAll('[data-dec]').forEach((b) => b.addEventListener('click', () => changeQty(+b.dataset.dec, -1)));
        body.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => {
          CART.items.splice(+b.dataset.rm, 1); saveCart(CART); renderBag();
        }));
        const keep = document.getElementById('bagKeep');
        if (keep) keep.addEventListener('click', closeBag);
        const co = document.getElementById('bagCheckout');
        if (co) co.addEventListener('click', checkoutBag);
      }

      function changeQty(i, delta) {
        const it = CART.items[i]; if (!it) return;
        const note = document.getElementById('bagNote');
        const next = (Number(it.quantity) || 1) + delta;
        if (next < 1) { CART.items.splice(i, 1); saveCart(CART); renderBag(); return; }
        // Re-read the live product, so a cap that was true when the item went in
        // cannot quietly go stale while the bag sits there.
        const pr = PRODUCTS.find((p) => p.id === it.product_id);
        const cap = pr ? maxQtyFor(pr) : (it.product_kind === 'digital' ? 1 : 99);
        if (next > cap) { if (note) note.textContent = 'Only ' + cap + ' available.'; return; }
        it.quantity = next; saveCart(CART); renderBag();
      }

      async function checkoutBag() {
        if (!CART.items.length) return;
        const btn = document.getElementById('bagCheckout');
        const note = document.getElementById('bagNote');
        // No account needed. store-checkout runs with auth optional and treats the
        // anon key as "guest", so a signed-out shopper goes straight to Stripe, which
        // collects their email on its own page. A stored session still gets sent, so
        // a signed-in buyer keeps their order tied to their account.
        const token = storedSession();
        btn.disabled = true; btn.textContent = 'Opening checkout…';
        try {
          const res = await fetch(`${SUPABASE_URL}/functions/v1/store-checkout`, {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${token || SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
            body: JSON.stringify({ items: CART.items.map((it) => ({
              product_id: it.product_id,
              quantity: it.quantity,
              variant: { size: it.size || null, color: it.color || null },
            })) }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Checkout failed (${res.status})`);
          if (!data.url) throw new Error('No checkout link returned');
          // Emptied before we leave. Stripe owns this bag now, and a back-button
          // return should land on an empty bag rather than a stale one the buyer
          // might pay for twice.
          saveCart(emptyCart());
          window.location.href = data.url;
        } catch (e) {
          note.textContent = e.message;
          btn.disabled = false; btn.textContent = 'Checkout';
        }
      }

      document.getElementById('bagBtn').addEventListener('click', openBag);
      document.getElementById('bagClose').addEventListener('click', closeBag);
      document.getElementById('bagScrim').addEventListener('click', closeBag);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBag(); });
      CART = loadCart();
      paintBagCount();

      // ── Product quick-view ──
      let CURRENT = null, SEL = { size: null, color: null };
      function openProduct(pr) {
        CURRENT = pr; QTY = 1;
        const imgs = imagesOf(pr);
        document.getElementById('ovName').textContent = pr.name || '';
        document.getElementById('ovPrice').textContent = fmtMoney(pr.price, pr.currency);
        document.getElementById('ovDesc').textContent = pr.description || '';
        SEL = { size: null, color: null };
        const sizes = Array.isArray(pr.sizes) ? pr.sizes : [];
        const colors = Array.isArray(pr.colors) ? pr.colors : [];
        const details = Array.isArray(pr.details) ? pr.details : [];
        window._selSizes = sizes; window._selColors = colors;
        document.getElementById('ovDetails').innerHTML = details.filter((d) => d && d.value).map((d) =>
          `<div class="row"><span class="k">${esc(d.label || '')}</span><span class="v">${esc(d.value)}</span></div>`).join('');
        const grp = (label, arr, key) => '<div class="p-opt-group"><div class="p-opt-label">' + label + '</div><div class="chips">'
          + arr.map((v) => `<button type="button" class="chip" data-g="${key}" data-v="${esc(v)}">${esc(v)}</button>`).join('') + '</div></div>';
        let optsHtml = '';
        if (sizes.length) optsHtml += grp('Size', sizes, 'size');
        if (colors.length) optsHtml += grp('Color', colors, 'color');
        const ovOpts = document.getElementById('ovOptions');
        ovOpts.innerHTML = optsHtml;
        ovOpts.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
          const g = c.dataset.g; SEL[g] = c.dataset.v;
          ovOpts.querySelectorAll('.chip[data-g="' + g + '"]').forEach((x) => x.classList.toggle('sel', x === c));
        }));
        const soldOut = pr.product_kind === 'physical' && pr.inventory !== null && pr.inventory !== undefined && pr.inventory <= 0;
        const main = document.getElementById('ovMain');
        main.src = imgs[0] || '';
        main.style.display = imgs.length ? 'block' : 'none';
        const thumbs = document.getElementById('ovThumbs');
        thumbs.innerHTML = imgs.map((u, i) => `<img src="${esc(u)}" data-u="${esc(u)}" class="${i===0?'sel':''}" alt="">`).join('');
        thumbs.querySelectorAll('img').forEach(t => t.addEventListener('click', () => {
          main.src = t.dataset.u;
          thumbs.querySelectorAll('img').forEach(x => x.classList.toggle('sel', x === t));
        }));
        document.getElementById('ovQtyRow').style.display = (pr.product_kind === 'physical' && !soldOut) ? 'flex' : 'none';
        document.getElementById('qVal').textContent = '1';
        const buy = document.getElementById('ovBuy');
        buy.disabled = !!soldOut; buy.textContent = soldOut ? 'Sold out' : 'Add to bag';
        document.getElementById('ovNote').textContent = '';
        document.getElementById('ov').classList.add('open');
      }
      function closeOv(){ document.getElementById('ov').classList.remove('open'); }
      document.getElementById('ovClose').addEventListener('click', closeOv);
      document.getElementById('ov').addEventListener('click', e => { if (e.target.id === 'ov') closeOv(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOv(); });
      document.getElementById('qMinus').addEventListener('click', () => { QTY = Math.max(1, QTY-1); document.getElementById('qVal').textContent = QTY; });
      document.getElementById('qPlus').addEventListener('click', () => {
        // Never offer more than the seller has; store-checkout refuses it anyway, and
        // being told at the Stripe page would be a worse place to find out.
        const cap = maxQtyFor(CURRENT);
        if (QTY + 1 > cap) { document.getElementById('ovNote').textContent = 'Only ' + cap + ' available.'; return; }
        QTY = QTY + 1; document.getElementById('qVal').textContent = QTY;
      });

      // Adding is local and instant now — nothing leaves the browser until Checkout
      // in the bag drawer. The size/colour gate stays exactly where it was: a line
      // with no size chosen is a line the seller cannot fulfil.
      document.getElementById('ovBuy').addEventListener('click', () => {
        if (!CURRENT) return;
        const note = document.getElementById('ovNote');
        note.textContent = '';
        if ((window._selSizes || []).length && !SEL.size) { note.textContent = 'Please select a size.'; return; }
        if ((window._selColors || []).length && !SEL.color) { note.textContent = 'Please select a color.'; return; }
        if (!addToBag(CURRENT, SEL, QTY)) return;
        closeOv();
        openBag();
      });

      document.getElementById('ovKeep').addEventListener('click', closeOv);

      (async function () {
        const username = getUsername();
        if (!username) return notFound('');
        try {
          const { data, error } = await db.rpc('public_artist_profile', { p_username: username });
          if (error || !data) return notFound(username);
          PROFILE = data;
          const { data: prods } = await db.from('products')
            .select('id,name,description,price,currency,product_kind,image_url,images,inventory,sizes,colors,details,category')
            .eq('artist_id', data.id).eq('is_active', true)
            .order('created_at', { ascending: false });
          PRODUCTS = Array.isArray(prods) ? prods : [];
          render();
        } catch (e) { notFound(username); }
      })();

      // ── Return from Stripe ───────────────────────────────────────
      // A guest has no order history to land in, so Stripe sends them back to the
      // storefront and the session id in the URL is the only handle they hold on
      // their own purchase. store-receipt trades it for a receipt; the id is then
      // stripped from the address bar so it stops riding along in history and
      // referrers. The receipt deliberately carries no address and no email.
      (function storeReturn() {
        const q = new URLSearchParams(location.search);
        const outcome = q.get('store');
        if (outcome !== 'success' && outcome !== 'canceled') return;
        const sessionId = q.get('session') || '';

        const rc = document.getElementById('rc');
        const eyebrow = document.getElementById('rcEyebrow');
        const title = document.getElementById('rcTitle');
        const msg = document.getElementById('rcMsg');
        const lines = document.getElementById('rcLines');
        const dls = document.getElementById('rcDownloads');
        const note = document.getElementById('rcNote');
        const close = () => rc.classList.remove('open');
        document.getElementById('rcClose').addEventListener('click', close);
        rc.addEventListener('click', (e) => { if (e.target.id === 'rc') close(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
        rc.classList.add('open');
        try { history.replaceState({}, '', location.pathname); } catch (e) {}

        if (outcome === 'canceled') {
          eyebrow.textContent = 'Checkout';
          title.textContent = 'Checkout canceled';
          msg.textContent = 'Nothing was charged. The store is right where you left it.';
          return;
        }
        eyebrow.textContent = 'Order';
        title.textContent = 'Thank you';
        if (!/^cs_[A-Za-z0-9_]{10,200}$/.test(sessionId)) {
          msg.textContent = 'Your payment went through. Look for the confirmation in your email.';
          return;
        }
        msg.textContent = 'Fetching your receipt…';

        const row = (k, v) => `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
        const COPY = {
          paid:       ['Payment complete', 'Your order is confirmed. A receipt is on its way to your email.'],
          processing: ['Payment received', 'We’re finalising your order — this takes a few seconds.'],
          pending:    ['Waiting on confirmation', 'Stripe hasn’t confirmed this payment yet. If you finished checkout it will land shortly.'],
        };

        // The guest trades their session id for a short-lived signed URL, per line,
        // because a bag can hold more than one download. Signed with
        // Content-Disposition: attachment, so this saves the file and leaves the
        // receipt on screen rather than navigating away from it.
        async function downloadLine(btn, productId) {
          const label = btn.textContent;
          btn.disabled = true; btn.textContent = 'Preparing\u2026';
          try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/store-download`, {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
              body: JSON.stringify({ session_id: sessionId, product_id: productId }),
            });
            const d = await res.json().catch(() => ({}));
            if (!res.ok || !d.url) throw new Error(d.error || 'Could not prepare your download');
            window.location.href = d.url;
          } catch (e) {
            msg.textContent = e.message;
          }
          btn.disabled = false; btn.textContent = label;
        }

        let tries = 0;
        async function poll() {
          tries++;
          let r, code;
          try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/store-receipt`, {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
              body: JSON.stringify({ session_id: sessionId }),
            });
            code = res.status;
            r = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(r.error || `Receipt unavailable (${res.status})`);
          } catch (e) {
            if (code === 404) {
              title.textContent = 'Order not found';
              msg.textContent = 'We couldn’t find an order for that link. If you were charged, email us and we’ll sort it out.';
            } else {
              msg.textContent = 'Your payment went through, but the receipt wouldn’t load just now. Look for the confirmation in your email.';
            }
            return;
          }

          const copy = COPY[r.status] || ['Order', 'Status: ' + (r.status || 'unknown')];
          title.textContent = copy[0];
          msg.textContent = copy[1];

          // A bag is a list of lines. An older response with only the single-item
          // fields still renders, as one line.
          const items = (Array.isArray(r.items) && r.items.length) ? r.items : [{
            product_id: null, product_name: r.product_name, quantity: r.quantity,
            amount: r.amount, variant: r.variant, fulfillment_status: r.fulfillment_status,
            download_ready: !!r.download_ready,
          }];
          lines.innerHTML = items.map((it) => {
            const v = it.variant || {};
            const bits = [v.size ? 'Size: ' + v.size : '', v.color ? 'Color: ' + v.color : ''].filter(Boolean).join(' \u00b7 ');
            const qty = Number(it.quantity) > 1 ? ' \u00d7 ' + it.quantity : '';
            const label = (it.product_name || 'Item') + qty + (bits ? '  (' + bits + ')' : '');
            return row(label, it.amount != null ? fmtMoney(it.amount, r.currency) : '');
          }).join('')
            + ((r.order_total != null && items.length > 1) ? row('Order total', fmtMoney(r.order_total, r.currency)) : '')
            + (items.some((it) => it.fulfillment_status === 'unfulfilled') ? row('Shipping', 'Preparing to ship') : '');

          // store-receipt only says whether a download exists; the signed URL is
          // minted by store-download when a button is clicked, so it cannot go stale
          // while the receipt sits open.
          const ready = items.filter((it) => it.download_ready);
          if (ready.length) {
            dls.innerHTML = ready.map((it) =>
              '<button class="buy" data-dl="' + esc(it.product_id || '') + '">Download '
              + esc(it.product_name || 'your files') + '</button>').join('');
            dls.querySelectorAll('[data-dl]').forEach((b) =>
              b.addEventListener('click', () => downloadLine(b, b.dataset.dl)));
            note.textContent = ready.length > 1
              ? 'Grab them now \u2014 these download links live on this page only.'
              : 'Grab it now \u2014 this download link lives on this page only.';
          }
          // The webhook is what marks it paid and attaches the download, and it
          // often lands a beat after Stripe has already redirected the buyer.
          if (r.status !== 'paid' && tries < 5) setTimeout(poll, 4000);
        }
        poll();
      })();
    </script>
</body>
</html>
