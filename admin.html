<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>AIAD — Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
    <style>
      :root{--teal:#00D4FF;--mag:#FF3DFF;--bg:#0A0A0A;--card:#141414;--bd:rgba(255,255,255,0.08);--tx:#fff;--mut:rgba(255,255,255,0.55);--artist:#FF3DFF;--collab:#FFB020;--fan:#4D8BFF;}
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
      .wrap{max-width:1280px;margin:0 auto;padding:26px 20px 90px}
      .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
      .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em}
      .brand img{width:26px;height:26px;border-radius:6px}
      .muted{color:var(--mut)}
      .btn{background:rgba(255,255,255,0.08);color:#fff;font-weight:600;border:none;border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
      .btn.primary{background:linear-gradient(135deg,#00D4FF,#0077B6);color:#001018}
      .gate{max-width:440px;margin:14vh auto;text-align:center}
      .gate h1{font-size:22px;margin-bottom:10px}.gate p{color:var(--mut);margin-bottom:20px;line-height:1.6}
      .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px;margin-bottom:22px}
      .kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 15px}
      .kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
      .kpi .v{font-size:24px;font-weight:800;margin-top:6px}
      .kpi .s{font-size:12px;color:var(--teal);margin-top:2px}
      .grid{display:grid;gap:16px;margin-bottom:16px}
      .g3{grid-template-columns:1.4fr 1fr 1fr}
      .g2{grid-template-columns:1fr 1fr}
      @media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
      .panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
      .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:14px}
      .chartbox{position:relative;height:230px}
      .funnel .step{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
      .funnel .lbl{width:92px;color:var(--mut);text-transform:capitalize}
      .funnel .track{flex:1;height:22px;background:rgba(255,255,255,0.05);border-radius:7px;overflow:hidden}
      .funnel .fill{height:100%;background:linear-gradient(90deg,#00D4FF,#7A5CFF);display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:#001018}
      .funnel .pct{width:44px;text-align:right;color:var(--mut)}
      .cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;line-height:1.4}
      .cloud span{cursor:default}
      .tablewrap{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-top:16px}
      .tablehead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--bd);gap:12px;flex-wrap:wrap}
      .tablehead h2{font-size:15px;font-weight:700}
      .search{background:rgba(255,255,255,0.05);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;color:#fff;font-size:13px;min-width:220px}
      table{width:100%;border-collapse:collapse;font-size:13px}
      th,td{text-align:left;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05);white-space:nowrap}
      th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--card)}
      td.email{color:var(--teal)}
      .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:rgba(255,255,255,0.08);text-transform:capitalize}
      .pill.artist{background:rgba(0,212,255,0.15);color:#7fe6ff}.pill.fan{background:rgba(255,102,255,0.15);color:#ff9dff}.pill.collaborator{background:rgba(124,252,140,0.14);color:#a9f7b5}
      .chk{color:var(--teal)}.scroll{max-height:56vh;overflow:auto}
      /* pending onboarding */
      .porow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
      .porow:last-child{border-bottom:none}
      .poname{flex:1;min-width:0}
      .poname .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .poname .e{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .podays{font-size:12px;font-weight:700;white-space:nowrap}
      /* world map role dots */
      #worldmap{height:440px}
      .maplegend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--mut)}
      .maplegend b{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#ddd}
      .ldot{width:10px;height:10px;border-radius:50%;display:inline-block}
      .jvm-marker circle{transform-box:fill-box;transform-origin:center}
      @keyframes aiadPulse{0%{opacity:.9;transform:scale(.55)}70%{opacity:0;transform:scale(2.4)}100%{opacity:0;transform:scale(2.4)}}
      .aiad-ping{transform-box:fill-box;transform-origin:center;animation:aiadPulse 1.8s ease-out infinite}
    </style>
</head>
<body>
    <div class="wrap">
      <div class="top">
        <div class="brand"><img src="/icon-192.png" alt="AIAD"/>AIAD · Admin</div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="muted" id="genAt"></span>
          <button class="btn" onclick="load()">Refresh</button>
          <button class="btn primary" id="csvBtn" style="display:none" onclick="exportCsv()">Export CSV</button>
        </div>
      </div>
      <div id="root"><div class="muted" style="padding:40px 0;text-align:center">Loading…</div></div>
    </div>

    <script>
      const REF='uapiytquwuhtewqieegx', API='https://'+REF+'.supabase.co';
      const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcGl5dHF1d3VodGV3cWllZWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NzcwMTksImV4cCI6MjA4OTI1MzAxOX0.BLs2RdStghm0_cF8t70cBTX1GWcowGRwID7TAG8Mg38';
      let DATA=null; const CHARTS=[];
      const PAL=['#00D4FF','#7A5CFF','#FF3DFF','#00E39A','#FFB020','#FF5C7A','#4D8BFF','#B980FF'];
      const ROLECOL={artist:'#FF3DFF',collaborator:'#FFB020',fan:'#4D8BFF'};
      const esc=(s)=>s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      // Share + auto-refresh the app's login session so an expired token self-renews.
      const SB=window.supabase.createClient(API,ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'sb-'+REF+'-auth-token'}});
      async function token(){ try{ const {data}=await SB.auth.getSession(); return data.session?data.session.access_token:null; }catch(e){ return null; } }
      // If a magic-link sign-in completes on this page, load the dashboard automatically.
      SB.auth.onAuthStateChange(function(ev,s){ if(s&&s.access_token) load(); });
      function fmtDate(s){ try{ return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; } }
      function gate(m){
        var inp='width:100%;background:#161616;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;color:#fff;font-size:15px;margin-bottom:10px';
        document.getElementById('root').innerHTML=
          '<div class="gate"><h1>Admin sign in</h1><p>'+esc(m)+'</p>'+
          '<input id="gEmail" type="email" placeholder="Email" autocomplete="username" style="'+inp+'"/>'+
          '<input id="gPass" type="password" placeholder="Password" autocomplete="current-password" style="'+inp+'" onkeydown="if(event.key===\'Enter\')window.gLogin()"/>'+
          '<button class="btn primary" style="width:100%;padding:12px" onclick="window.gLogin()">Sign in</button>'+
          '<div id="gMsg" class="muted" style="margin-top:12px;font-size:13px;line-height:1.5"></div></div>';
      }
      window.gLogin=async function(){
        var em=(document.getElementById('gEmail').value||'').trim();
        var pw=(document.getElementById('gPass').value||'');
        var msg=document.getElementById('gMsg');
        if(!em||!pw){ msg.textContent='Enter your email and password.'; return; }
        msg.textContent='Signing in…';
        try{
          var res=await SB.auth.signInWithPassword({email:em,password:pw});
          if(res.error){ msg.textContent=res.error.message; return; }
          load();
        }catch(e){ msg.textContent='Error: '+e.message; }
      };

      async function load(){
        const t=await token(); if(!t){ gate('Sign in with the founder account to view site analytics.'); return; }
        try{
          const r=await fetch(API+'/rest/v1/rpc/admin_analytics',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{}'});
          if(r.status===401||r.status===403){ gate('This account is not authorized. Sign in as the founder.'); return; }
          const d=await r.json();
          if(!r.ok||!d||d.message){ gate((d&&d.message)||'Could not load analytics.'); return; }
          DATA=d; render(d);
        }catch(e){ gate('Error: '+e.message); }
      }

      function donut(id,obj,opts){
        const el=document.getElementById(id); if(!el) return;
        const entries=Object.entries(obj||{}).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
        CHARTS.push(new Chart(el,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:PAL,borderColor:'#141414',borderWidth:2}]},options:{plugins:{legend:{position:'right',labels:{color:'#bbb',boxWidth:12,font:{size:11}}}},cutout:'62%',...(opts||{})}}));
      }
      function line(id,arr){
        const el=document.getElementById(id); if(!el) return;
        // fill last 30 days
        const map={}; (arr||[]).forEach(p=>map[p.d]=p.c);
        const days=[],vals=[]; const now=new Date();
        for(let i=29;i>=0;i--){ const dt=new Date(now); dt.setDate(now.getDate()-i); const k=dt.toISOString().slice(0,10); days.push(dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})); vals.push(map[k]||0); }
        CHARTS.push(new Chart(el,{type:'bar',data:{labels:days,datasets:[{data:vals,backgroundColor:'#00D4FF',borderRadius:3,maxBarThickness:14}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#888',maxTicksLimit:8,font:{size:10}},grid:{display:false}},y:{ticks:{color:'#888',precision:0,font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}}}}}));
      }
      function funnel(f){
        const order=['signed_up','onboarded','verified','posted','paid']; const base=(f&&f.signed_up)||1;
        return '<div class="funnel">'+order.map(k=>{const v=(f&&f[k])||0;const pct=Math.round(v/base*100);return '<div class="step"><span class="lbl">'+k.replace('_',' ')+'</span><span class="track"><span class="fill" style="width:'+Math.max(pct,6)+'%">'+v+'</span></span><span class="pct">'+pct+'%</span></div>';}).join('')+'</div>';
      }
      function cloud(obj){
        const entries=Object.entries(obj||{}).filter(([k,v])=>k&&k!=='unknown'&&v>0).sort((a,b)=>b[1]-a[1]).slice(0,30);
        if(!entries.length) return '<span class="muted" style="font-size:13px">Not enough data yet.</span>';
        const max=entries[0][1],min=entries[entries.length-1][1];
        return '<div class="cloud">'+entries.map(([k,v],i)=>{const sz=14+Math.round((v-min)/((max-min)||1)*26);const col=PAL[i%PAL.length];return '<span style="font-size:'+sz+'px;color:'+col+';font-weight:'+(500+Math.round((v-min)/((max-min)||1)*300))+'" title="'+esc(k)+': '+v+'">'+esc(k)+'</span>';}).join('')+'</div>';
      }
      // Pending onboarding — people who signed up but never finished setup.
      function pendingPanel(list){
        list=list||[];
        var head='<h2>Pending onboarding'+(list.length?' ('+list.length+')':'')+'</h2>';
        if(!list.length) return '<div class="panel">'+head+'<div class="muted" style="font-size:13px">Everyone who signed up finished onboarding. Nothing stuck. 🎉</div></div>';
        var rows=list.map(function(u){
          var days=u.days||0;
          var urg=days>=7?'#FF5C7A':days>=3?'#FFB020':'#7fe6ff';
          var who=esc(u.name||u.email||'Someone');
          var meta=esc((u.email||'')+(u.country?' · '+u.country:''));
          var subj=encodeURIComponent('Finish setting up your AIAD profile');
          var bodyt=encodeURIComponent('Hi '+((u.name||'there'))+",\n\nYou signed up for AIAD but haven't finished setting up your profile yet — it only takes a minute to pick your role and you're in.\n\nJump back in: https://www.aiad.studio\n\n— The AIAD team");
          var mailto=u.email?('mailto:'+encodeURIComponent(u.email)+'?subject='+subj+'&body='+bodyt):'#';
          return '<div class="porow"><div class="poname"><div class="n">'+who+'</div><div class="e">'+meta+'</div></div>'+
                 '<span class="podays" style="color:'+urg+'">'+days+'d</span>'+
                 '<a class="btn" style="padding:6px 12px;font-size:12px" href="'+mailto+'">Nudge</a></div>';
        }).join('');
        return '<div class="panel">'+head+'<div style="max-height:340px;overflow:auto">'+rows+'</div></div>';
      }

      function render(d){
        CHARTS.forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS.length=0;
        document.getElementById('genAt').textContent='Updated '+fmtDate(d.generated_at);
        document.getElementById('csvBtn').style.display='inline-block';
        const t=d.totals||{}, roles=t.by_role||{}, cr=d.credits||{};
        const kpi=(l,v,s)=>'<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';
        const cards=kpi('Total users',t.users||0,(d.signups_today||0)+' today')+kpi('Artists',roles.artist||0)+kpi('Fans',roles.fan||0)+kpi('Collaborators',roles.collaborator||0)+kpi('Verified',t.verified||0)+kpi('Founding',t.founding||0)+kpi('Paying',t.paid||0,'$'+(t.mrr||0)+'/mo')+kpi('Signups 7d',d.signups_7d||0,(d.signups_30d||0)+' in 30d')+kpi('Posts',t.posts||0)+kpi('Tracks',t.tracks||0)+kpi('Avg credits',cr.avg_balance||0,(cr.unlimited||0)+' unlimited')+kpi('Pending setup',(d.pending_onboarding||[]).length,'not onboarded');

        const users=d.users||[];
        const lastSeen=parseInt(localStorage.getItem('aiad_admin_lastseen')||'0',10);
        const newCount=users.filter(u=>new Date(u.created_at).getTime()>lastSeen).length;
        const banner=newCount>0?'<div style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px">🆕 <b>'+newCount+' new signup'+(newCount>1?'s':'')+'</b> since your last visit — highlighted below.</div>':'';
        const rows=users.map(u=>{var isNew=new Date(u.created_at).getTime()>lastSeen; return '<tr data-s="'+esc(((u.name||'')+' '+(u.email||'')+' '+(u.username||'')+' '+(u.location||'')+' '+(u.city||'')+' '+(u.country||'')+' '+(u.genre||'')).toLowerCase())+'"'+(isNew?' style="background:rgba(0,212,255,0.07)"':'')+'>'+
          '<td>'+esc(u.name||'—')+(u.founding_number?' <span class="muted">#'+u.founding_number+'</span>':'')+'</td>'+
          '<td class="email">'+esc(u.email||'')+'</td><td>'+(u.username?'@'+esc(u.username):'')+'</td>'+
          '<td><span class="pill '+esc(u.role||'')+'">'+esc(u.role||'—')+'</span></td>'+
          '<td>'+esc(u.genre||u.industry||'—')+'</td><td>'+esc([u.city,u.country].filter(Boolean).join(', ')||u.location||'—')+'</td>'+
          '<td>'+(((u.posts||0)>0||(u.tracks||0)>0)?('<span style="color:var(--teal)">'+(u.posts||0)+' posts</span>'+((u.tracks||0)>0?' · '+(u.tracks||0)+' tracks':'')):'<span class="muted">none</span>')+'</td>'+
          '<td>'+esc(u.plan||'free')+'</td>'+
          '<td>'+(u.verified?'<span class="chk">✓</span>':'')+'</td><td class="muted">'+fmtDate(u.created_at)+'</td></tr>';}).join('');

        document.getElementById('root').innerHTML=
          banner+
          '<div class="cards">'+cards+'</div>'+
          '<div class="grid g3">'+
            '<div class="panel"><h2>Signups · last 30 days</h2><div class="chartbox"><canvas id="cSign"></canvas></div></div>'+
            '<div class="panel"><h2>By role</h2><div class="chartbox"><canvas id="cRole"></canvas></div></div>'+
            '<div class="panel"><h2>By plan</h2><div class="chartbox"><canvas id="cPlan"></canvas></div></div>'+
          '</div>'+
          '<div class="panel" style="margin-bottom:16px"><h2>Live activity map — where your community is</h2>'+
            '<div class="maplegend"><b><span class="ldot" style="background:'+ROLECOL.artist+'"></span>Artists</b><b><span class="ldot" style="background:'+ROLECOL.collaborator+'"></span>Collaborators</b><b><span class="ldot" style="background:'+ROLECOL.fan+'"></span>Fans</b><span style="margin-left:auto">'+users.length+' located</span></div>'+
            '<div id="worldmap"></div></div>'+
          '<div class="grid g3">'+
            '<div class="panel"><h2>Conversion funnel</h2>'+funnel(d.funnel)+'</div>'+
            '<div class="panel"><h2>Posts by type</h2><div class="chartbox"><canvas id="cPost"></canvas></div></div>'+
            '<div class="panel"><h2>Genre & interest map</h2>'+cloud(d.by_genre)+'</div>'+
          '</div>'+
          '<div class="grid g2">'+
            pendingPanel(d.pending_onboarding)+
            '<div class="panel"><h2>Quick stats</h2><div style="font-size:13.5px;line-height:2;color:var(--mut)">'+
              'Verified rate: <b style="color:#fff">'+Math.round((t.verified||0)/((t.users||1))*100)+'%</b><br>'+
              'Paid conversion: <b style="color:#fff">'+Math.round((d.funnel&&d.funnel.paid||0)/((t.users||1))*100)+'%</b><br>'+
              'Have posted: <b style="color:#fff">'+(d.funnel&&d.funnel.posted||0)+' of '+(t.users||0)+'</b><br>'+
              'Onboarded: <b style="color:#fff">'+(d.funnel&&d.funnel.onboarded||0)+' of '+(t.users||0)+'</b><br>'+
              'Founding slots used: <b style="color:#fff">'+(t.founding||0)+' / 100</b><br>'+
              'Total credits in circulation: <b style="color:#fff">'+(cr.total_balance||0)+'</b>'+
            '</div></div>'+
          '</div>'+
          '<div class="grid g2">'+
            '<div class="panel"><h2>Where they\'re from</h2>'+cloud(Object.keys(d.by_country||{}).length?d.by_country:d.by_location)+'</div>'+
            '<div class="panel"><h2>Top cities</h2>'+cloud(cityCounts(users))+'</div>'+
          '</div>'+
          '<div class="tablewrap"><div class="tablehead"><h2>All signups ('+users.length+')</h2>'+
            '<input class="search" id="q" placeholder="Search name, email, city, genre…" oninput="filter()"/></div>'+
            '<div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Username</th><th>Role</th><th>Genre</th><th>Location</th><th>Activity</th><th>Plan</th><th>Verified</th><th>Joined</th></tr></thead><tbody id="tb">'+rows+'</tbody></table></div></div>';

        line('cSign',d.signups_by_day);
        donut('cRole',roles);
        donut('cPlan',d.by_plan);
        donut('cPost',d.posts_by_type);
        setTimeout(function(){ worldMap(d); }, 80);
        localStorage.setItem('aiad_admin_lastseen', String(Date.now()));
      }

      function cityCounts(users){ var o={}; (users||[]).forEach(function(u){ var c=[u.city,u.country].filter(Boolean).join(', '); if(c) o[c]=(o[c]||0)+1; }); return o; }

      // Compact gazetteer: city -> [lat,lng]. Unknown cities fall back to country centroid.
      var CITY={
        'london':[51.5,-0.12],'manchester':[53.48,-2.24],'birmingham':[52.48,-1.9],'glasgow':[55.86,-4.25],'dublin':[53.35,-6.26],
        'new york':[40.71,-74.0],'brooklyn':[40.68,-73.94],'los angeles':[34.05,-118.24],'san francisco':[37.77,-122.42],'chicago':[41.88,-87.63],
        'atlanta':[33.75,-84.39],'miami':[25.76,-80.19],'houston':[29.76,-95.37],'dallas':[32.78,-96.8],'austin':[30.27,-97.74],
        'seattle':[47.61,-122.33],'boston':[42.36,-71.06],'washington':[38.9,-77.04],'nashville':[36.16,-86.78],'detroit':[42.33,-83.05],
        'toronto':[43.65,-79.38],'vancouver':[49.28,-123.12],'montreal':[45.5,-73.57],'mexico city':[19.43,-99.13],

      var CC={'US':[39.8,-98.6],'GB':[54,-2],'CA':[56.1,-106.3],'AU':[-25.3,133.8],'NZ':[-41,174],'IE':[53.4,-8],'FR':[46.6,2.2],'DE':[51.2,10.4],'ES':[40.2,-3.7],'PT':[39.4,-8.2],'IT':[41.9,12.6],'NL':[52.1,5.3],'SE':[60.1,18.6],'NO':[60.5,8.5],'DK':[56,10],'CH':[46.8,8.2],'AT':[47.6,14.6],'PL':[51.9,19.1],'NG':[9.1,8.7],'GH':[7.9,-1],'KE':[0.02,37.9],'ZA':[-30.6,22.9],'EG':[26.8,30.8],'MA':[31.8,-7.1],'BR':[-14.2,-51.9],'AR':[-38.4,-63.6],'CO':[4.6,-74.3],'PE':[-9.2,-75],'MX':[23.6,-102.5],'JP':[36.2,138.3],'KR':[35.9,127.8],'CN':[35.9,104.2],'HK':[22.3,114.2],'SG':[1.35,103.8],'TH':[15.9,100.99],'ID':[-0.8,113.9],'PH':[12.9,121.8],'IN':[20.6,79],'AE':[23.4,53.8],'IL':[31,34.9],'TR':[39,35.2],'JM':[18.1,-77.3]};
      function coordsFor(city,country,cc){
        if(city){ var k=String(city).trim().toLowerCase(); if(CITY[k]) return CITY[k].slice(); }
        var code=(cc||'').toUpperCase();
        if(code && CC[code]) return CC[code].slice();
        if(country && String(country).trim().length===2 && CC[String(country).trim().toUpperCase()]) return CC[String(country).trim().toUpperCase()].slice();
        if(country){ var nm=String(country).trim(); // country name -> code best-effort
          var NAME={'united states':'US','usa':'US','united kingdom':'GB','uk':'GB','england':'GB','canada':'CA','australia':'AU','new zealand':'NZ','ireland':'IE','france':'FR','germany':'DE','spain':'ES','portugal':'PT','italy':'IT','netherlands':'NL','sweden':'SE','norway':'NO','denmark':'DK','switzerland':'CH','austria':'AT','poland':'PL','nigeria':'NG','ghana':'GH','kenya':'KE','south africa':'ZA','egypt':'EG','morocco':'MA','brazil':'BR','argentina':'AR','colombia':'CO','peru':'PE','mexico':'MX','japan':'JP','south korea':'KR','china':'CN','hong kong':'HK','singapore':'SG','thailand':'TH','indonesia':'ID','philippines':'PH','india':'IN','uae':'AE','united arab emirates':'AE','israel':'IL','turkey':'TR','jamaica':'JM'};
          var code2=NAME[nm.toLowerCase()]; if(code2&&CC[code2]) return CC[code2].slice();
        }
        return null;
      }
      function jitter(c,i){ if(!c) return c; var a=(i%12)*0.5236; var r=0.6+((i%5)*0.25); return [c[0]+Math.sin(a)*r, c[1]+Math.cos(a)*r]; }

      function worldMap(d){
        var el=document.getElementById('worldmap'); if(!el||!window.jsVectorMap) return;
        try{ if(window._wm){ window._wm.destroy(); window._wm=null; } }catch(e){}
        el.innerHTML='';
        var users=(d&&d.users)||[];
        // build role-colored markers, jittering co-located points so they don't overlap
        var seen={}; var markers=[]; var colors=[];
        users.forEach(function(u,i){
          var c=coordsFor(u.city,u.country,u.country_code);
          if(!c) return;
          var key=c[0].toFixed(2)+','+c[1].toFixed(2);
          seen[key]=(seen[key]||0); c=jitter(c,seen[key]); seen[key]++;
          var role=(u.role||'fan').toLowerCase();
          markers.push({name:(u.name||u.email||'Member')+' · '+role+(u.city?' · '+u.city:''),coords:c});
          colors.push(ROLECOL[role]||'#00D4FF');
        });
        var codes=d&&d.by_country_code||{}; var vals={}; Object.keys(codes).forEach(function(k){ vals[String(k).toUpperCase()]=codes[k]; });
        try{
          window._wm=new jsVectorMap({
            selector:'#worldmap', map:'world', backgroundColor:'transparent', zoomOnScroll:false, zoomButtons:true,
            regionStyle:{initial:{fill:'#1c1c1c',stroke:'#0A0A0A','stroke-width':0.4},hover:{fill:'#2a2a2a'}},
            series:{regions:[{attribute:'fill',scale:['#141b1f','#173a44'],normalizeFunction:'polynomial',values:vals}]},
            markers:markers,
            markerStyle:{initial:{r:5,fill:'#00D4FF','fill-opacity':0.95,stroke:'#0A0A0A','stroke-width':1},hover:{r:7}},
            onMarkerTooltipShow:function(ev,tip,idx){ tip.text(markers[idx].name); }
          });
          // color each marker by role + add a pulsing ring behind it
          setTimeout(function(){ styleMarkers(el,colors); },60);
        }catch(e){ el.innerHTML='<div class="muted" style="padding:20px">Map unavailable.</div>'; }
      }
      function styleMarkers(el,colors){
        try{
          var circles=el.querySelectorAll('.jvm-marker');
          circles.forEach(function(circ,i){
            var col=colors[i]||'#00D4FF';
            circ.setAttribute('fill',col);
            circ.style.fill=col;
            // clone as a pulsing ring behind the solid dot
            var ping=circ.cloneNode(true);
            ping.removeAttribute('class'); ping.setAttribute('fill','none');
            ping.setAttribute('stroke',col); ping.setAttribute('stroke-width','2');
            ping.setAttribute('r', circ.getAttribute('r')||'5');
            ping.classList.add('aiad-ping');
            ping.style.animationDelay=((i%9)*0.2)+'s';
            circ.parentNode.insertBefore(ping,circ);
          });
        }catch(e){}
      }

      window.filter=function(){ const q=(document.getElementById('q').value||'').toLowerCase(); document.querySelectorAll('#tb tr').forEach(tr=>{tr.style.display=tr.dataset.s.includes(q)?'':'none';}); };
      window.exportCsv=function(){ if(!DATA||!DATA.users)return; const cols=['name','email','username','role','genre','industry','location','country','city','career_stage','plan','verified','founding_number','posts','tracks','last_active','created_at']; const head=cols.join(','); const lines=DATA.users.map(u=>cols.map(c=>{let v=u[c]==null?'':String(u[c]); if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"'; return v;}).join(',')); const b=new Blob([head+'\n'+lines.join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='aiad-signups-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); };

      load();

      // ── Admin Agent chat ──
      const AGENT_HISTORY=[];
      function agentUI(){
        const btn=document.createElement('button'); btn.textContent='✦ Admin Agent';
        btn.style.cssText='position:fixed;right:20px;bottom:20px;z-index:9998;background:linear-gradient(135deg,#00D4FF,#0077B6);color:#001018;font-weight:700;border:none;border-radius:999px;padding:12px 20px;font-size:14px;cursor:pointer;box-shadow:0 8px 30px rgba(0,180,216,0.35)';
        btn.onclick=()=>{const p=document.getElementById('agentPanel');p.style.display=p.style.display==='flex'?'none':'flex';const i=document.getElementById('agentInput');if(i)i.focus();};
        document.body.appendChild(btn);
        const panel=document.createElement('div'); panel.id='agentPanel';
        panel.style.cssText='display:none;position:fixed;right:20px;bottom:74px;z-index:9999;width:min(440px,92vw);height:min(560px,72vh);background:#0f0f0f;border:1px solid var(--bd);border-radius:18px;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6)';
        panel.innerHTML='<div style="padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center"><strong>Admin Agent</strong><span style="cursor:pointer;opacity:.6" onclick="document.getElementById(\'agentPanel\').style.display=\'none\'">✕</span></div><div id="agentThread" style="flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.5"></div><div style="padding:12px;border-top:1px solid var(--bd);display:flex;gap:8px"><input id="agentInput" placeholder="Ask or tell the agent…" style="flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--bd);border-radius:999px;padding:10px 14px;color:#fff;font-size:13px" onkeydown="if(event.key===\'Enter\')window.agentSend()"><button onclick="window.agentSend()" style="background:linear-gradient(135deg,#00D4FF,#0077B6);color:#001018;font-weight:600;border:none;border-radius:999px;padding:0 16px;cursor:pointer">Send</button></div>';
        document.body.appendChild(panel);
        bubble('assistant','Hi — I run the back office. Ask me anything ("signups this week", "revenue", "who hasn\'t posted") or tell me to act ("verify @therealpartyg", "give @hardyindiigo 200 credits", "set @user to artist_pro").');
      }
      function bubble(role,text){ const t=document.getElementById('agentThread'); if(!t)return; const d=document.createElement('div'); d.style.cssText=role==='user'?'align-self:flex-end;max-width:85%;background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.25);border-radius:12px 12px 2px 12px;padding:9px 12px':'align-self:flex-start;max-width:90%;background:#161616;border:1px solid var(--bd);border-radius:12px 12px 12px 2px;padding:9px 12px;white-space:pre-wrap'; d.textContent=text; t.appendChild(d); t.scrollTop=t.scrollHeight; return d; }
      window.agentSend=async function(){ const inp=document.getElementById('agentInput'); const msg=(inp.value||'').trim(); if(!msg)return; inp.value=''; bubble('user',msg); const loading=bubble('assistant','…'); const t=await token(); if(!t){loading.textContent='Sign in as founder first.';return;} try{ const r=await fetch(API+'/functions/v1/admin-assistant',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({message:msg,history:AGENT_HISTORY})}); const d=await r.json(); const ans=d.answer||d.error||'Something went wrong.'; loading.textContent=ans; AGENT_HISTORY.push({role:'user',content:msg},{role:'assistant',content:ans}); if(d.actions&&d.actions.length){ setTimeout(load,700); } }catch(e){ loading.textContent='Error: '+e.message; } };
      agentUI();
    </script>
