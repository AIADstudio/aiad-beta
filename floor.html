<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Floor — AIAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0716;--panel:#170F28;--panel2:#1E1434;--ink:#F0EAFA;--soft:#9A8CB8;--rule:#2E2046;
  --teal:#19E3C0;--magenta:#FF4FD8;--purple:#9B5CFF;--warn:#FFB45C;--go:#19E3C0;
  --ui:"Space Grotesk",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:
   radial-gradient(90% 60% at 15% 0%,rgba(155,92,255,.16),transparent 60%),
   radial-gradient(70% 50% at 95% 10%,rgba(255,79,216,.12),transparent 60%),
   var(--bg);
  color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;min-height:100vh}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.wrap{max-width:1300px;margin:0 auto;padding:16px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:27px;font-weight:700;margin:0;letter-spacing:-.4px;
  background:linear-gradient(92deg,var(--teal),var(--magenta) 55%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--soft);font-size:13px;margin:0}
.notice{border:1px solid var(--warn);background:rgba(255,180,92,.1);padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:13px;display:none}
.notice.on{display:block}
.brief{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
textarea{flex:1 1 340px;min-height:52px;resize:vertical;background:var(--panel);
  border:1px solid var(--rule);border-radius:11px;padding:10px 12px;font-size:14px}
.btn{background:linear-gradient(135deg,var(--teal),var(--magenta) 60%,var(--purple));color:#0B0617;border:none;border-radius:11px;
  padding:11px 20px;font-weight:700;cursor:pointer;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--soft)}
.chip:hover{border-color:var(--magenta);color:var(--magenta)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1020px){.stage{grid-template-columns:1fr}}
.screen{position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden;
  background:#0A0614;aspect-ratio:16/10;touch-action:none;
  box-shadow:0 0 0 1px rgba(255,79,216,.08),0 24px 60px -24px rgba(155,92,255,.5)}
@media (max-width:1020px){.screen{aspect-ratio:4/3}}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;bottom:0;padding:9px 14px;font-size:12.5px;color:#C8B8E6;
  background:linear-gradient(0deg,rgba(10,6,20,.95),rgba(10,6,20,0));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.boot{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:13px}
.hint{position:absolute;top:12px;right:14px;font-size:11px;color:var(--soft);opacity:.6;pointer-events:none}
.tag3d{position:absolute;transform:translate(-50%,-100%);pointer-events:none;
  font-size:11px;font-weight:600;white-space:nowrap;
  background:rgba(14,8,26,.86);border:1px solid rgba(255,255,255,.12);border-radius:999px;
  padding:2px 9px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .2s}
.tag3d.on{opacity:1}
.tag3d i{width:6px;height:6px;border-radius:50%;display:block}
.tag3d small{color:var(--soft);font-weight:500;font-size:10px}

aside h2{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--soft);text-transform:none}
.crew{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--rule);
  border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--magenta)}
.row.sel{border-color:var(--teal);background:var(--panel2)}
.row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.row .nm{font-weight:600;font-size:13px}
.row .sub{color:var(--soft);font-size:11px;display:block;line-height:1.3}
.row .st{color:var(--soft);font-size:11px;margin-left:auto}
.row.done .st{color:var(--go)} .row.busy .st{color:var(--teal)} .row.blocked .st{color:var(--warn)}
.read{border:1px solid var(--rule);border-radius:13px;background:var(--panel);padding:14px}
.read h3{margin:0;font-size:15px;font-weight:600}
.read .who{color:var(--soft);font-size:12px;margin:3px 0 10px}
.read pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font-family:var(--ui);font-size:13px;max-height:40vh;overflow:auto}
.empty{color:var(--soft);font-size:13px;margin:0}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tab{flex:1;background:none;border:1px solid var(--rule);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;color:var(--soft)}
.tab.on{border-color:var(--teal);color:var(--teal);background:var(--panel2)}
.ask input{width:100%;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;
  padding:7px 9px;font-size:12.5px;margin-bottom:8px;font-family:var(--ui);color:var(--ink)}
.sugs{max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.sug{text-align:left;background:var(--panel2);border:1px solid transparent;border-radius:8px;
  padding:7px 9px;font-size:12.5px;cursor:pointer;color:var(--ink);line-height:1.35}
.sug:hover{border-color:var(--magenta);color:var(--magenta)}
.sugs::-webkit-scrollbar{width:8px}.sugs::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px}
footer{color:var(--soft);font-size:11.5px;text-align:center;padding:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>The Floor</h1>
    <p class="tag">Your stage agents, at desks. Drag to look around, click anyone to brief them.</p>
  </div>
  <div class="notice" id="notice"></div>
  <div class="brief">
    <textarea id="input" placeholder="What's going on? e.g. First single drops in five weeks. 2,000 monthly listeners, $1,500 to spend, no manager."></textarea>
    <button class="btn" id="go">Call the room</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="stage">
    <div class="screen" id="screen">
      <div class="boot" id="boot">Building the floor…</div>
      <div class="hint">drag to orbit · scroll to zoom</div>
      <div class="hud" id="hud">Floor's quiet. Nobody's been given anything yet.</div>
    </div>
    <aside>
      <h2>Who's in</h2>
      <div class="crew" id="crew"></div>
      <div class="read" id="read"><p class="empty">Click anyone on the floor to brief them or read their desk.</p></div>
    </aside>
  </div>
</div>
<footer>Each desk is a live model call.</footer>

}

function logoTexture(){
  const c=document.createElement("canvas"); c.width=1024; c.height=512;
  const g=c.getContext("2d");
  g.fillStyle="#0B0718"; g.fillRect(0,0,1024,512);
  for(let i=0;i<512;i+=4){ g.fillStyle="rgba(255,255,255,0.012)"; g.fillRect(0,i,1024,1); }
  const grad=g.createLinearGradient(140,0,900,0);
  grad.addColorStop(0,"#19E3C0"); grad.addColorStop(0.55,"#FF4FD8"); grad.addColorStop(1,"#9B5CFF");
  g.font="700 250px 'Space Grotesk', Helvetica, Arial, sans-serif";
  g.textAlign="center"; g.textBaseline="middle";
  g.fillStyle=grad; g.fillText("AIAD",512,236);
  g.font="500 54px 'Space Grotesk', Helvetica, Arial, sans-serif";
  g.fillStyle="rgba(240,234,250,0.72)"; g.letterSpacing="14px";
  g.fillText("S T U D I O",512,392);
  const t=new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding) t.encoding=THREE.sRGBEncoding;
  return t;
}

  const arms=[],legs=[];
  [-1,1].forEach(s=>{

    const th=limb(0.11,0.42,matPants); th.position.y=-0.21; hp.add(th);

/* ------------------------------------------------------------- animation */
const clock=new THREE.Clock();
function stepAgent(a,dt,t){
  const o=a.obj,rig=o.userData.rig;
  const dx=a.tx-o.position.x, dz=a.tz-o.position.z, d=Math.hypot(dx,dz);
  if(d>0.08 && !a.seated){
    const sp=Math.min(3.3*dt,d);
    o.position.x+=dx/d*sp; o.position.z+=dz/d*sp;
    const want=Math.atan2(dx,dz);
    let diff=want-o.rotation.y;
    while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2;
    o.rotation.y+=diff*Math.min(1,10*dt);
    const w=t*9;
    rig.legs[0].hp.rotation.x=Math.sin(w)*0.55; rig.legs[0].kn.rotation.x=Math.max(0,-Math.sin(w+0.6))*0.7;
    rig.legs[1].hp.rotation.x=-Math.sin(w)*0.55; rig.legs[1].kn.rotation.x=Math.max(0,Math.sin(w+0.6))*0.7;
    rig.arms[0].sh.rotation.x=-Math.sin(w)*0.45; rig.arms[1].sh.rotation.x=Math.sin(w)*0.45;
    rig.arms[0].el.rotation.x=-0.25; rig.arms[1].el.rotation.x=-0.25;
    rig.hips.position.y=0.88+Math.abs(Math.sin(w))*0.04;
    o.position.y=0; a.walking=true; return;
  }
  if(a.walking && d<=0.08){ a.walking=false; if(a.onArrive){const f=a.onArrive;a.onArrive=null;f();} }
  if(a.seated){
    o.position.y=0.07; o.rotation.y=a.trot; rig.hips.position.y=0.5;
    rig.legs.forEach(l=>{l.hp.rotation.x=-1.45; l.kn.rotation.x=1.5;});
    const typing=a.state==="working";
    const osc=typing?Math.sin(t*11+a.phase):0;
    rig.arms.forEach((ar,i)=>{
      ar.sh.rotation.x=typing?-0.95:-0.35; ar.sh.rotation.z=ar.side*0.12;
      ar.el.rotation.x=typing?(-0.75+osc*(i?0.12:-0.12)):-0.5;
    });
    rig.torso.rotation.x=typing?0.14:0.04+Math.sin(t*1.6+a.phase)*0.015;
    rig.head.rotation.x=typing?0.22:0.05;
  }else{
    o.position.y=0; o.rotation.y+=(a.trot-o.rotation.y)*Math.min(1,6*dt);
    rig.hips.position.y=0.88+Math.sin(t*1.5+a.phase)*0.012;
    rig.legs.forEach(l=>{l.hp.rotation.x*=0.85; l.kn.rotation.x*=0.85;});
    rig.arms.forEach(ar=>{ar.sh.rotation.x*=0.85; ar.el.rotation.x+=(-0.18-ar.el.rotation.x)*0.2;});
    rig.torso.rotation.x*=0.9; rig.head.rotation.x*=0.9;
  }
}

let booted=false;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  agents.forEach(a=>stepAgent(a,dt,t));
  DESKS.forEach((d,i)=>{
    const a=agents.find(x=>x.desk===i);
    const lit=a&&a.state==="working", done=a&&a.state==="done";
    const pulse=lit?2.4+Math.sin(t*4)*0.4:done?0.8:0.25;
    d.glow.intensity+=(pulse-d.glow.intensity)*0.08;
    d.scr.material.emissiveIntensity+=((lit?1.3:done?0.5:0.2)-d.scr.material.emissiveIntensity)*0.08;
    d.trim.emissiveIntensity+=((lit?3.2:done?2.4:1.2)-d.trim.emissiveIntensity)*0.07;
    d.paper.visible=!!done;
  });
  applyCam(); renderer.render(scene,camera); placeLabels();
  if(!booted){booted=true; const b=$("boot"); if(b) b.remove();}
  requestAnimationFrame(loop);
}

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)/r.width)*2-1;
  ptr.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(agents.map(a=>a.obj),true);
  return hits.length?hits[0].object.userData.agentId:null;
}

/* --------------------------------------------------------------- the work */
// The floor runs on the `stage-agent` edge function — the same one the dashboard
// talks to. Every desk is one row in public.stage_skills; the skill body stays
// server side and only the finished answer comes back, which is the whole point
// of running the skills there. The credential is the signed-in artist's own JWT,
// handed over exactly the way clips.html hands one to /api/render: stage-agent
// runs with verify_jwt on and reads the skill table with its own service role,
// so no privileged key is shipped to this page.
const STAGE_BY_AGENT={
  discover:"discover",    develop:"develop",        release:"record_release",
  touring:"touring_live", brand:"brand_sync",       rights:"rights_royalties",
  finance:"finances",     strategy:"strategy_team", contract:"contract_review"
};

let signedIn=false;

// Read the session per call rather than caching the token once at boot: a long
// sitting on the floor outlives an access token, and autoRefreshToken has
// usually replaced it by the time the next desk reports in.
async function session(){
  const {data}=await db.auth.getSession();
  return (data&&data.session)||null;
}

async function callStage(stage,message,context){
  const s=await session();
  if(!s) throw new Error("signed_out");
  const res=await fetch(SUPABASE_URL+"/functions/v1/stage-agent",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token},
    body:JSON.stringify({stage:stage,user_id:s.user.id,message:message,context:context||""})
  });
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||data.error) throw new Error((data&&data.error)||("stage-agent "+res.status));
  return String(data.response||"");
}

session().then(s=>{
  signedIn=!!s;
  if(!s){$("notice").classList.add("on");
    $("notice").textContent="The floor is staffed by your AIAD account. Sign in on AIAD, then come back to this page.";
    $("go").disabled=true;}
}).catch(()=>{});

// Deciding who is needed is the one thing stage-agent has no slot for: it takes
// one of nine fixed stage slugs and answers in the AIAD prose contract, so there
// is no planner stage to call and no JSON mode to ask for. strategy_team is the
// nearest honest home — sequencing, and who the artist needs around them, is
// literally that skill — so the brief goes there asking for JSON only, and a
// reply that arrives wrapped in the usual prose gets dug out of it. When nothing
// parseable comes back the keyword router below picks the desks instead, so the
// button never dead-ends on a formatting miss.
const ROUTE_HINTS={
  discover:["ready to release","a&r","honest","rate my","which track","single","signed","label","demo"],
  develop:["visual","identity","image","artwork","cover","photos","era","my sound","aesthetic","bio"],
  release:["release","rollout","distribute","playlist","pre-save","presave","drop","timeline","ep","album","dsp","spotify editorial"],
  touring:["tour","show","gig","venue","live","routing","guarantee","ticket","festival","sold out","support slot"],
  brand:["sync","placement","supervisor","brand","partnership","advert","commercial","licence","license","soundtrack"],
  rights:["split","royalt","publishing","master","register","pro ","copyright","ownership","soundexchange","mechanical"],
  finance:["budget","afford","cost","spend","money","cash","advance","recoup","income","$","tax","price"],
  strategy:["manager","team","next move","priorit","career","leverage","should i","focus","plan","milestone"],
  contract:["contract","deal","agreement","clause","term sheet","360","nda","offer","signing","sign this"]
};

// The planner is asked for bare JSON, but stage-agent's response contract pushes
// every answer towards prose, so the object may well arrive with paragraphs
// around it. Walk from the first brace to its match, respecting strings, rather
// than regexing for it.
function firstJsonObject(str){
  const i=str.indexOf("{"); if(i<0) return null;
  let depth=0,inStr=false,esc=false;
  for(let j=i;j<str.length;j++){
    const c=str[j];
    if(inStr){ if(esc) esc=false; else if(c==="\\") esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"') inStr=true;
    else if(c==="{") depth++;
    else if(c==="}"){ depth--; if(depth===0){ try{ return JSON.parse(str.slice(i,j+1)); }catch(_){ return null; } } }
  }
  return null;
}

function routeByKeyword(brief){
  const b=" "+brief.toLowerCase()+" ";
  const ids=CREW.map(c=>({id:c.id,n:(ROUTE_HINTS[c.id]||[]).filter(k=>b.includes(k)).length}))
    .filter(x=>x.n>0).sort((x,y)=>y.n-x.n).map(x=>x.id);
  // Nothing matched a hint: the three desks that have something useful to say
  // about almost any situation an artist walks in with.
  return (ids.length?ids:["strategy","release","finance"]).slice(0,4);
}

function fallbackTasks(brief){
  return routeByKeyword(brief).map(id=>{
    const c=CREW.find(x=>x.id===id);
    return {agent:id,title:c.role.split("—")[0].trim()+" read",
      instruction:"Working from the artist's situation, produce the deliverable your stage owns and give them your call on it."};
  });
}

function goTo(a,x,z,rot,cb){a.tx=x;a.tz=z;a.trot=rot;a.seated=false;a.onArrive=cb;a.walking=true;}
function seatOf(a){
  if(a.desk>=0) return DESKS[a.desk].seat;
  const host=agents.find(x=>x.desk>=0&&(x.state==="working"||x.state==="done"));
  const d=host?DESKS[host.desk].seat:DESKS[0].seat;
  return {x:d.x+1.6,z:d.z,rot:d.rot};
}
function askOne(a,prompt){
  if(!signedIn) return;
  const ctx=$("input").value.trim();
  a.task={title:prompt,instruction:prompt+(ctx?("\n\nContext from the artist: "+ctx):"")};
  a.state="walking"; a.out=""; a.err=""; renderCrew();
  hud(a.name+" is taking it: "+prompt);
  const s=seatOf(a);
  goTo(a,s.x,s.z,s.rot,()=>{ if(a.desk>=0) a.seated=true; work(a,ctx||prompt); });
  tabMode="desk"; renderRead();
}

async function callRoom(){
  const brief=$("input").value.trim(); if(!brief||!signedIn) return;
  $("go").disabled=true; $("go").textContent="On it";
  agents.forEach(a=>{a.state="idle";a.out="";a.task=null;a.err="";
    goTo(a,a.home.x,a.home.z,Math.PI,null);});
  renderCrew(); renderRead(); hud("Reading the situation and deciding who's needed…");
  let tasks=null,planLine="";
  try{
    const raw=await callStage("strategy_team",
"Decide which specialists on the floor this artist's situation needs.\n\nTHE ROOM (use the id exactly):\n"+
CREW.map(c=>c.id+" — "+c.role+". "+c.brief).join("\n")+
"\n\nCall in only who is genuinely needed — usually two to four, never the whole room by default. "+
"Only bring in \"contract\" if an actual agreement is on the table.\n"+
"Each instruction must name a concrete deliverable for this artist's situation.\n\n"+
"Answer with this JSON object and nothing else: no sentence before it, no sentence after it, "+
"and none of the usual section labels.\n"+
'{"plan":"one sentence","tasks":[{"agent":"id","title":"4-6 words","instruction":"what exactly to produce"}]}',
      "The artist's situation: "+brief);
    const plan=firstJsonObject(raw);
    if(plan&&Array.isArray(plan.tasks)){
      tasks=plan.tasks.filter(t=>t&&agents.some(a=>a.id===t.agent)).slice(0,5);
      planLine=String(plan.plan||"");
    }
  }catch(e){
    const m=String((e&&e.message)||e||"error");
    if(m==="signed_out"){
      hud("Your session expired. Reload the page and sign in again.");
      $("go").disabled=false;$("go").textContent="Call the room";return;
    }
    hud("Couldn't reach the room: "+m+". Splitting the work here instead.");
  }
  if(!tasks||!tasks.length){
    tasks=fallbackTasks(brief);
    planLine=planLine||"Split from the brief here on the floor — the room's planner didn't answer in JSON.";
  }
  hud((planLine||"Work split.")+" — "+tasks.length+" called in.");
  tasks.forEach((t,i)=>{
    const a=agents.find(x=>x.id===t.agent);
    a.task={title:String(t.title||"Their read"),
            instruction:String(t.instruction||"").trim()||"Give the artist your call on this situation."};
    a.state="walking";
    setTimeout(()=>{
      const s=seatOf(a);
      goTo(a,s.x,s.z,s.rot,()=>{ if(a.desk>=0) a.seated=true; work(a,brief); });
    },i*500);
  });
  renderCrew();
}

async function work(a,brief){
  a.state="working"; a.out=""; renderCrew(); if(selId===a.id) renderRead();
  try{
    // One shot, not a stream: stage-agent answers with a whole JSON body, so there
    // is no token-by-token text to paint as it arrives. Nothing is needed to keep
    // the desk animating either — the typing pose is driven off a.state, which
    // stays "working" until this await resolves.
    //
    // The persona preamble this prompt used to carry is gone on purpose. The skill
    // row behind the slug already is the specialist, and stage-agent's own response
    // contract governs the shape of the answer, so a second set of instructions
    // here would only fight it. The assignment is the question; the situation is
    // context, which stage-agent merges with the artist's own cached stats.
    a.out=await callStage(STAGE_BY_AGENT[a.id],a.task.instruction,"The artist's situation: "+brief);
    a.state="done";
  }catch(e){
    a.state="blocked";
    const m=String((e&&e.message)||e||"unknown");
    a.err=m==="signed_out"?"Your session expired. Reload the page and sign in again."
      :/rate.?limit|429/i.test(m)?"Hit a rate limit. Give it a minute and try again."
      :"That call failed: "+m;
  }
  renderCrew(); if(selId===a.id) renderRead();
  if(!agents.some(x=>x.state==="working")){
    $("go").disabled=false; $("go").textContent="New situation";
    const done=agents.filter(x=>x.state==="done").length;
    if(done) hud(done+" on desks. Click anyone to read theirs.");
  }
}

PRESETS.forEach(p=>{
  const c=document.createElement("button");
  c.className="chip"; c.textContent=p.length>50?p.slice(0,48)+"…":p; c.title=p;
  c.onclick=()=>{$("input").value=p;$("input").focus();};
  $("chips").appendChild(c);
});
$("go").onclick=callRoom;
renderCrew(); resize(); applyCam(); loop();
})();
</script>
