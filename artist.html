<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>AIAD — Artist</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root{
        --teal-light:#00D4FF;--teal:#00B4D8;--teal-dark:#0077B6;
        --bg-primary:#0A0A0A;--bg-card:#161616;
        --text-primary:#FFFFFF;--text-secondary:rgba(255,255,255,0.6);
        --text-muted:rgba(255,255,255,0.4);--border-default:rgba(255,255,255,0.08);
        --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      }
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:var(--bg-primary);color:var(--text-primary);font-family:var(--font);
        min-height:100vh;-webkit-font-smoothing:antialiased}
      a{color:inherit;text-decoration:none}
      /* Top brand bar */
      .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
        padding:12px 20px;background:rgba(10,10,10,0.85);backdrop-filter:blur(12px);
        border-bottom:1px solid var(--border-default)}
      .brandmark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}
      .brandmark img{width:28px;height:28px;border-radius:7px}
      .signin-btn{background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));
        color:#001018;font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px}
      .wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}
      .state{text-align:center;color:var(--text-muted);padding:80px 0;font-size:15px}
      .header{display:flex;align-items:center;gap:20px}
      .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;
        background:rgba(255,255,255,0.08);border:1px solid var(--border-default);flex-shrink:0;
        display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:var(--text-muted)}
      .name-row{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700;line-height:1.1}
      .handle{color:var(--text-muted);margin-top:4px;font-size:15px}
      .meta{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
        color:var(--text-secondary);font-size:14px}
      .meta .role{text-transform:capitalize}
      .founding{background:rgba(0,212,255,0.14);color:var(--teal-light);
        border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
      .check{width:24px;height:24px;flex-shrink:0}
      /* Gate banner */
      .gate{margin:24px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;
        background:rgba(0,180,216,0.08);border:1px solid rgba(0,180,216,0.25);border-radius:14px;padding:14px 16px}
      .gate p{font-size:14px;color:var(--text-secondary)}
      .gate a{white-space:nowrap;background:var(--text-primary);color:#000;font-weight:600;font-size:13px;
        padding:8px 16px;border-radius:999px}
      .section-title{margin:32px 0 16px;font-size:12px;font-weight:600;letter-spacing:.08em;
        text-transform:uppercase;color:var(--text-muted)}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      @media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:4px}}
      .post{aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--border-default);
        background:var(--bg-card);position:relative;cursor:pointer}
      .post img,.post video{width:100%;height:100%;object-fit:cover;display:block}
      .post .txt{padding:14px;font-size:13px;color:var(--text-secondary);
        display:flex;align-items:center;justify-content:center;height:100%;text-align:center}
      .post .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:34px;color:var(--teal-light)}
      .post .type-badge{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
        background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
      .post .cap{position:absolute;left:0;right:0;bottom:0;padding:8px;font-size:11px;color:#fff;
        background:linear-gradient(transparent,rgba(0,0,0,0.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .empty{border:1px solid var(--border-default);border-radius:14px;background:rgba(255,255,255,0.02);
        padding:40px;text-align:center;color:var(--text-muted);font-size:14px}
      .brand{margin-top:48px;text-align:center;color:var(--text-muted);font-size:13px}
      .brand a{color:var(--teal-light)}
      /* Lightbox */
      .lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.9);display:none;
        align-items:center;justify-content:center;padding:20px}
      .lb.open{display:flex}
      .lb-inner{max-width:520px;width:100%;background:var(--bg-card);border:1px solid var(--border-default);
        border-radius:16px;overflow:hidden}
      .lb-media{width:100%;max-height:60vh;background:#000;display:flex;align-items:center;justify-content:center}
      .lb-media img,.lb-media video{max-width:100%;max-height:60vh;display:block}
      .lb-body{padding:16px}
      .lb-cap{color:var(--text-secondary);font-size:14px;margin-bottom:14px;min-height:1px}
      .lb-gate{display:flex;align-items:center;justify-content:space-between;gap:12px;
        border-top:1px solid var(--border-default);padding-top:14px}
      .lb-gate span{color:var(--text-muted);font-size:13px}
      .lb-gate a{background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;
        font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px}
      .lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;cursor:pointer;opacity:.8}
    </style>
</head>
<body>
    <div class="topbar">
      <a class="brandmark" href="/"><img src="/icon-192.png" alt="AIAD" />AIAD</a>
      <a class="signin-btn" href="/">Sign in</a>
    </div>

    <div class="wrap" id="root">
      <div class="state">Loading…</div>
    </div>

    <!-- Lightbox for viewing a post (interaction gated behind sign-in) -->
    <div class="lb" id="lb">
      <span class="lb-close" id="lbClose">&times;</span>
      <div class="lb-inner">
        <div class="lb-media" id="lbMedia"></div>
        <div class="lb-body">
          <div class="lb-cap" id="lbCap"></div>
          <div class="lb-gate">
            <span>Sign in to like, comment &amp; follow</span>
            <a href="/">Sign in</a>
          </div>
        </div>
      </div>
    </div>

    <template id="checkTpl">
      <svg class="check" viewBox="0 0 24 24" role="img" aria-label="Verified artist">
        <title>Verified artist</title>
        <path fill="#00B4D8" d="M12 1.5l2.35 1.71 2.9-.02 1.68 2.37 2.79.83.02 2.9L23.5 12l-1.66 2.31-.02 2.9-2.79.83-1.68 2.37-2.9-.02L12 22.5l-2.35-1.71-2.9.02-1.68-2.37-2.79-.83-.02-2.9L.5 12l1.66-2.31.02-2.9 2.79-.83 1.68-2.37 2.9.02L12 1.5z"/>
        <path fill="#fff" d="M10.6 15.4l-3-3 1.4-1.4 1.6 1.6 4-4 1.4 1.4-5.4 5.4z"/>
      </svg>
    </template>

    <script>
      const SUPABASE_URL = 'https://uapiytquwuhtewqieegx.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcGl5dHF1d3VodGV3cWllZWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NzcwMTksImV4cCI6MjA4OTI1MzAxOX0.BLs2RdStghm0_cF8t70cBTX1GWcowGRwID7TAG8Mg38';
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });

      const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])));

      function getUsername() {
        const parts = location.pathname.split('/').filter(Boolean);
        const i = parts.indexOf('artist');
        if (i !== -1 && parts[i + 1]) return decodeURIComponent(parts[i + 1]);
        return new URLSearchParams(location.search).get('u') || '';
      }
      const checkSvg = () => document.getElementById('checkTpl').innerHTML;

      let POSTS = [];
      function tile(post, idx) {
        const cap = esc(post.content || '');
        const capBar = cap ? `<div class="cap">${cap}</div>` : '';
        if (post.media_url) {
          if (post.media_type === 'video')
            return `<div class="post" data-idx="${idx}"><video src="${esc(post.media_url)}#t=0.1" muted preload="metadata" playsinline></video><span class="type-badge">▶</span>${capBar}</div>`;
          if (post.media_type === 'audio')
            return `<div class="post" data-idx="${idx}"><span class="ico">♪</span><span class="type-badge">♪</span>${capBar}</div>`;
          return `<div class="post" data-idx="${idx}"><img src="${esc(post.media_url)}" alt="${cap}" loading="lazy" />${capBar}</div>`;
        }
        return `<div class="post" data-idx="${idx}"><div class="txt">${cap || '—'}</div></div>`;
      }

      function openLightbox(post) {
        const media = document.getElementById('lbMedia');
        if (post.media_url && post.media_type === 'video')
          media.innerHTML = `<video src="${esc(post.media_url)}" controls autoplay playsinline></video>`;
        else if (post.media_url && post.media_type === 'audio')
          media.innerHTML = `<div style="padding:32px;text-align:center"><div style="font-size:52px;color:var(--teal-light)">♪</div><audio src="${esc(post.media_url)}" controls style="margin-top:12px;width:100%"></audio></div>`;
        else if (post.media_url)
          media.innerHTML = `<img src="${esc(post.media_url)}" alt="" />`;
        else
          media.innerHTML = `<div style="padding:40px;color:var(--text-secondary);font-size:16px;text-align:center">${esc(post.content || '')}</div>`;
        document.getElementById('lbCap').textContent = post.content || '';
        document.getElementById('lb').classList.add('open');
      }
      function closeLightbox() {
        document.getElementById('lb').classList.remove('open');
        document.getElementById('lbMedia').innerHTML = '';
      }
      document.getElementById('lbClose').onclick = closeLightbox;
      document.getElementById('lb').onclick = (e) => { if (e.target.id === 'lb') closeLightbox(); };

      function render(p) {
        const root = document.getElementById('root');
        const name = p.full_name || ('@' + p.username);
        const initial = esc(name.charAt(0).toUpperCase());
        const avatar = p.avatar_url
          ? `<img class="avatar" src="${esc(p.avatar_url)}" alt="${esc(name)}" />`
          : `<div class="avatar">${initial}</div>`;

        POSTS = Array.isArray(p.posts) ? p.posts : [];
        const postsHtml = POSTS.length
          ? `<div class="grid">${POSTS.map((post, i) => tile(post, i)).join('')}</div>`
          : `<div class="empty">No posts yet.</div>`;

        document.title = `${name} — AIAD`;
        root.innerHTML = `
          <div class="header">
            ${avatar}
            <div>
              <div class="name-row">${esc(name)}${p.verified ? checkSvg() : ''}</div>
              <div class="handle">@${esc(p.username)}</div>
              <div class="meta">
                ${p.role ? `<span class="role">${esc(p.role)}</span>` : ''}
                ${p.industry ? `<span>· ${esc(p.industry)}</span>` : ''}
                ${p.founding_number != null ? `<span class="founding">Founding Artist #${esc(p.founding_number)}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="gate">
            <p>Follow ${esc(name)} on AIAD to like, comment &amp; get updates.</p>
            <a href="/">Sign up</a>
          </div>
          <div class="section-title">Posts</div>
          ${postsHtml}
          <div class="brand">Powered by <a href="/">AIAD</a></div>
        `;

        root.querySelectorAll('.post[data-idx]').forEach(el => {
          el.addEventListener('click', () => openLightbox(POSTS[+el.dataset.idx]));
        });
      }

      function notFound(username) {
        document.getElementById('root').innerHTML =
          `<div class="state">No artist found at <strong>@${esc(username)}</strong>.<br/><br/>
           <a href="/" style="color:var(--teal-light)">← Back to AIAD</a></div>`;
      }

      (async function () {
        const username = getUsername();
        if (!username) return notFound('');
        try {
          const { data, error } = await db.rpc('public_artist_profile', { p_username: username });
          if (error || !data) return notFound(username);
          render(data);
        } catch (e) { notFound(username); }
      })();
    </script>
</body>
</html>
