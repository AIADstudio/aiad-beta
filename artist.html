<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>AIAD — Artist</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root{
        --teal-light:#00D4FF;--teal:#00B4D8;--teal-dark:#0077B6;
        --bg-primary:#0A0A0A;--bg-card:#161616;
        --text-primary:#FFFFFF;--text-secondary:rgba(255,255,255,0.6);
        --text-muted:rgba(255,255,255,0.4);--border-default:rgba(255,255,255,0.08);
        --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      }
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:var(--bg-primary);color:var(--text-primary);font-family:var(--font);
        min-height:100vh;-webkit-font-smoothing:antialiased}
      a{color:inherit;text-decoration:none}
      /* Top brand bar */
      .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
        padding:12px 20px;background:rgba(10,10,10,0.85);backdrop-filter:blur(12px);
        border-bottom:1px solid var(--border-default)}
      .brandmark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}
      .brandmark img{width:28px;height:28px;border-radius:7px}
      .signin-btn{background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));
        color:#001018;font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px}
      .wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}
      .state{text-align:center;color:var(--text-muted);padding:80px 0;font-size:15px}
      .header{display:flex;align-items:center;gap:20px}
      .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;
        background:rgba(255,255,255,0.08);border:1px solid var(--border-default);flex-shrink:0;
        display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:var(--text-muted)}
      .name-row{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700;line-height:1.1}
      .handle{color:var(--text-muted);margin-top:4px;font-size:15px}
      .meta{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
        color:var(--text-secondary);font-size:14px}
      .meta .role{text-transform:capitalize}
      .founding{background:rgba(0,212,255,0.14);color:var(--teal-light);
        border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
      .check{width:24px;height:24px;flex-shrink:0}
      /* Gate banner */
      .gate{margin:24px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;
        background:rgba(0,180,216,0.08);border:1px solid rgba(0,180,216,0.25);border-radius:14px;padding:14px 16px}
      .gate p{font-size:14px;color:var(--text-secondary)}
      .gate a{white-space:nowrap;background:var(--text-primary);color:#000;font-weight:600;font-size:13px;
        padding:8px 16px;border-radius:999px}
      .section-title{margin:32px 0 16px;font-size:12px;font-weight:600;letter-spacing:.08em;
        text-transform:uppercase;color:var(--text-muted)}
      .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
      .stat{background:var(--bg-card,rgba(255,255,255,0.03));border:1px solid var(--border-default);
        border-radius:12px;padding:14px 16px;min-width:0}
      .stat-value{font-size:20px;font-weight:700;color:var(--text-primary);line-height:1.2}
      .stat-label{margin-top:2px;font-size:12px;color:var(--text-muted)}
      /* The first stat is the headline figure, so give it room to breathe. */
      .stat:first-child .stat-value{font-size:26px}
      /* Storefront */
      .store-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;
        background:linear-gradient(135deg,rgba(0,180,216,0.12),rgba(217,70,239,0.09));
        border:1px solid rgba(0,180,216,0.28);border-radius:16px;padding:18px 20px;margin-top:8px;transition:border-color .15s}
      .store-cta:hover{border-color:rgba(0,180,216,0.55)}
      .store-cta-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
      .store-cta-title{font-size:17px;font-weight:700;color:var(--text-primary);margin-top:3px}
      .store-cta-sub{font-size:13px;color:var(--text-secondary);margin-top:3px}
      .store-cta-btn{white-space:nowrap;background:var(--text-primary);color:#000;font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px}
      .store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
      .store-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:13px;padding:12px}
      .store-img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:9px;display:block}
      .store-img-empty{background:linear-gradient(135deg,#0d2f3f,#1a4a5e)}
      .store-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .store-price{font-size:13px;color:var(--text-secondary);margin-bottom:9px}
      .store-kind{color:var(--text-muted);font-size:12px}
      .store-buy{width:100%;padding:8px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;
        background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;font-family:var(--font)}
      .store-buy[disabled]{background:rgba(255,255,255,0.08);color:var(--text-muted);cursor:not-allowed}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      @media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:4px}}
      .post{aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--border-default);
        background:var(--bg-card);position:relative;cursor:pointer}
      .post img,.post video{width:100%;height:100%;object-fit:cover;display:block}
      .post .txt{padding:14px;font-size:13px;color:var(--text-secondary);
        display:flex;align-items:center;justify-content:center;height:100%;text-align:center}
      .post .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:34px;color:var(--teal-light)}
      .post .type-badge{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
        background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
      .post .cap{position:absolute;left:0;right:0;bottom:0;padding:8px;font-size:11px;color:#fff;
        background:linear-gradient(transparent,rgba(0,0,0,0.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .rel{border:1px solid var(--border-default);border-radius:14px;background:rgba(255,255,255,0.02);
        padding:14px;margin-bottom:12px}
      .rel-head{display:flex;align-items:center;gap:12px}
      .rel-art{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#12232b}
      .rel-title{font-weight:600;font-size:15px}
      .rel-meta{color:var(--text-muted);font-size:12px;margin-top:2px}
      .trk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border-default);font-size:14px}
      .trk:first-of-type{margin-top:10px}
      .trk-no{color:var(--text-muted);font-size:12px;width:18px;flex:0 0 auto;text-align:right}
      .trk-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .trk-dur{color:var(--text-muted);font-size:12px;flex:0 0 auto}
      .trk-play{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--border-default);
        background:rgba(255,255,255,0.04);color:var(--text-primary);cursor:pointer;font-size:11px;line-height:1}
      .trk-play:hover{border-color:var(--teal-light);color:var(--teal-light)}
      .trk-play[disabled]{opacity:.5;cursor:default}
      .trk.playing .trk-title{color:var(--teal-light)}
      .rel-note{color:var(--text-muted);font-size:12px;margin-top:10px}
      .empty{border:1px solid var(--border-default);border-radius:14px;background:rgba(255,255,255,0.02);
        padding:40px;text-align:center;color:var(--text-muted);font-size:14px}
      .brand{margin-top:48px;text-align:center;color:var(--text-muted);font-size:13px}
      .brand a{color:var(--teal-light)}
      /* Lightbox */
      .lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.9);display:none;
        align-items:center;justify-content:center;padding:20px}
      .lb.open{display:flex}
      .lb-inner{max-width:520px;width:100%;background:var(--bg-card);border:1px solid var(--border-default);
        border-radius:16px;overflow:hidden}
      .lb-media{width:100%;max-height:60vh;background:#000;display:flex;align-items:center;justify-content:center}
      .lb-media img,.lb-media video{max-width:100%;max-height:60vh;display:block}
      .lb-body{padding:16px}
      .lb-cap{color:var(--text-secondary);font-size:14px;margin-bottom:14px;min-height:1px}
      .lb-gate{display:flex;align-items:center;justify-content:space-between;gap:12px;
        border-top:1px solid var(--border-default);padding-top:14px}
      .lb-gate span{color:var(--text-muted);font-size:13px}
      .lb-gate a{background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;
        font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px}
      .lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;cursor:pointer;opacity:.8}
      /* Top-right auth + Instagram-style signup gate */
      .topbar-auth{display:flex;align-items:center;gap:14px}
      .signin-link{color:var(--text-secondary);font-size:13px;font-weight:500}
      .signin-link:hover{color:var(--text-primary)}
      .signup-btn{background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px}
      .su-card{max-width:360px;width:100%;background:var(--bg-card);border:1px solid var(--border-default);border-radius:18px;padding:30px 26px;text-align:center}
      .su-card .su-logo img{width:46px;height:46px;border-radius:12px;margin-bottom:14px}
      .su-card h2{font-size:20px;font-weight:700;margin-bottom:8px}
      .su-card p{color:var(--text-secondary);font-size:14px;margin-bottom:20px;line-height:1.5}
      .su-primary{display:block;background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;font-weight:700;font-size:15px;padding:12px;border-radius:12px}
      .su-alt{margin-top:14px;color:var(--text-muted);font-size:13px}
      .su-alt a{color:var(--teal-light)}
    </style>
</head>
<body>
    <div class="topbar">
      <a class="brandmark" href="/"><img src="/icon-192.png" alt="AIAD" />AIAD</a>
      <div class="topbar-auth">
        <a class="signin-link" href="/">Sign in</a>
        <a class="signup-btn" href="/">Sign up</a>
      </div>
    </div>

    <div class="wrap" id="root">
      <div class="state">Loading…</div>
    </div>

    <!-- Lightbox for viewing a post (interaction gated behind sign-in) -->
    <div class="lb" id="lb">
      <span class="lb-close" id="lbClose">&times;</span>
      <div class="lb-inner">
        <div class="lb-media" id="lbMedia"></div>
        <div class="lb-body">
          <div class="lb-cap" id="lbCap"></div>
          <div class="lb-gate">
            <span>Sign in to like, comment &amp; follow</span>
            <a href="/">Sign in</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Instagram-style signup gate: clicking any post opens this -->
    <div class="lb" id="signupModal">
      <span class="lb-close" id="suClose">&times;</span>
      <div class="su-card">
        <div class="su-logo"><img src="/icon-192.png" alt="AIAD"></div>
        <h2>Join AIAD</h2>
        <p id="suText">Sign up to follow this artist, like and comment on posts.</p>
        <a class="su-primary" href="/">Sign up</a>
        <div class="su-alt">Have an account? <a href="/">Sign in</a></div>
      </div>
    </div>

    <template id="checkTpl">
      <svg class="check" viewBox="0 0 24 24" role="img" aria-label="Verified artist">
        <title>Verified artist</title>
        <path fill="#00B4D8" d="M12 1.5l2.35 1.71 2.9-.02 1.68 2.37 2.79.83.02 2.9L23.5 12l-1.66 2.31-.02 2.9-2.79.83-1.68 2.37-2.9-.02L12 22.5l-2.35-1.71-2.9.02-1.68-2.37-2.79-.83-.02-2.9L.5 12l1.66-2.31.02-2.9 2.79-.83 1.68-2.37 2.9.02L12 1.5z"/>
        <path fill="#fff" d="M10.6 15.4l-3-3 1.4-1.4 1.6 1.6 4-4 1.4 1.4-5.4 5.4z"/>
      </svg>
    </template>

    <script>
      const SUPABASE_URL = 'https://uapiytquwuhtewqieegx.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcGl5dHF1d3VodGV3cWllZWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NzcwMTksImV4cCI6MjA4OTI1MzAxOX0.BLs2RdStghm0_cF8t70cBTX1GWcowGRwID7TAG8Mg38';
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

      const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])));

      function getUsername() {
        const parts = location.pathname.split('/').filter(Boolean);
        const i = parts.indexOf('artist');
        if (i !== -1 && parts[i + 1]) return decodeURIComponent(parts[i + 1]);
        return new URLSearchParams(location.search).get('u') || '';
      }
      const checkSvg = () => document.getElementById('checkTpl').innerHTML;

      let POSTS = [];
      let ARTIST_NAME = '';
      let ARTIST_ID = '', FOLLOWER_COUNT = 0;
      function tile(post, idx) {
        const cap = esc(post.content || '');
        const capBar = cap ? `<div class="cap">${cap}</div>` : '';
        if (post.media_url) {
          if (post.media_type === 'video')
            return `<div class="post" data-idx="${idx}"><video src="${esc(post.media_url)}#t=0.1" muted preload="metadata" playsinline></video><span class="type-badge">▶</span>${capBar}</div>`;
          if (post.media_type === 'audio')
            return `<div class="post" data-idx="${idx}"><span class="ico">♪</span><span class="type-badge">♪</span>${capBar}</div>`;
          return `<div class="post" data-idx="${idx}"><img src="${esc(post.media_url)}" alt="${cap}" loading="lazy" />${capBar}</div>`;
        }
        return `<div class="post" data-idx="${idx}"><div class="txt">${cap || '—'}</div></div>`;
      }

      function openLightbox(post) {
        const media = document.getElementById('lbMedia');
        if (post.media_url && post.media_type === 'video')
          media.innerHTML = `<video src="${esc(post.media_url)}" controls autoplay playsinline></video>`;
        else if (post.media_url && post.media_type === 'audio')
          media.innerHTML = `<div style="padding:32px;text-align:center"><div style="font-size:52px;color:var(--teal-light)">♪</div><audio src="${esc(post.media_url)}" controls style="margin-top:12px;width:100%"></audio></div>`;
        else if (post.media_url)
          media.innerHTML = `<img src="${esc(post.media_url)}" alt="" />`;
        else
          media.innerHTML = `<div style="padding:40px;color:var(--text-secondary);font-size:16px;text-align:center">${esc(post.content || '')}</div>`;
        document.getElementById('lbCap').textContent = post.content || '';
        document.getElementById('lb').classList.add('open');
      }
      function closeLightbox() {
        document.getElementById('lb').classList.remove('open');
        document.getElementById('lbMedia').innerHTML = '';
      }
      document.getElementById('lbClose').onclick = closeLightbox;
      document.getElementById('lb').onclick = (e) => { if (e.target.id === 'lb') closeLightbox(); };
      function openSignup() {
        document.getElementById('suText').textContent =
          `Sign up to follow ${ARTIST_NAME || 'this artist'}, like and comment on posts.`;
        document.getElementById('signupModal').classList.add('open');
      }
      function closeSignup() { document.getElementById('signupModal').classList.remove('open'); }
      document.getElementById('suClose').onclick = closeSignup;
      document.getElementById('signupModal').onclick = (e) => { if (e.target.id === 'signupModal') closeSignup(); };
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSignup(); });

      function render(p) {
        const root = document.getElementById('root');
        const name = p.display_name || ('@' + p.username);
        const initial = esc(name.charAt(0).toUpperCase());
        const avatar = p.avatar_url
          ? `<img class="avatar" src="${esc(p.avatar_url)}" alt="${esc(name)}" />`
          : `<div class="avatar">${initial}</div>`;

        POSTS = Array.isArray(p.posts) ? p.posts : [];
        const postsHtml = POSTS.length
          ? `<div class="grid">${POSTS.map((post, i) => tile(post, i)).join('')}</div>`
          : `<div class="empty">No posts yet.</div>`;

        // Stats come from public_artist_profile's `stats` key. artist_stats itself is
        // readable only by its owner, so the SECURITY DEFINER RPC hands out just these
        // display numbers — never handles or the raw platform payloads. Spotify won't
        // release monthly listeners or followers to apps, so those are the artist's own
        // figures; YouTube subscribers are the real API number when we have it.
        const stats = (p && typeof p.stats === 'object' && p.stats) || {};
        const statFields = [
          ['monthly_listeners',   'Monthly listeners'],
          ['spotify_followers',   'Spotify followers'],
          ['youtube_subscribers', 'YouTube subscribers'],
          ['instagram_followers', 'Instagram followers'],
          ['tiktok_followers',    'TikTok followers'],
        ].filter(([k]) => typeof stats[k] === 'number');
        const statsHtml = statFields.length
          ? `<div class="section-title">Stats</div>
             <div class="stats">
               ${statFields.map(([k, label]) => `
                 <div class="stat">
                   <div class="stat-value">${esc(Number(stats[k]).toLocaleString())}</div>
                   <div class="stat-label">${esc(label)}</div>
                 </div>`).join('')}
             </div>`
          : '';

        document.title = `${name} — AIAD`;
        root.innerHTML = `
          <div class="header">
            ${avatar}
            <div>
              <div class="name-row">${esc(name)}${p.verified ? checkSvg() : ''}</div>
              <div class="handle">@${esc(p.username)}</div>
              ${p.tagline ? `<div style="margin-top:6px;color:var(--text-secondary);font-size:14px">${esc(p.tagline)}</div>` : ''}
              <div class="meta">
                ${p.role ? `<span class="role">${esc(p.role)}</span>` : ''}
                ${p.industry ? `<span>· ${esc(p.industry)}</span>` : ''}
                ${p.founding_number != null ? `<span class="founding">Founding Artist #${esc(p.founding_number)}</span>` : ''}
              </div>
              <div style="margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                <button id="followBtn" onclick="toggleFollow(this)" data-following="0" style="background:linear-gradient(135deg,var(--teal-light),var(--teal-dark));color:#001018;font-weight:600;font-size:13px;padding:8px 22px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;">Follow</button>
                <span id="followerCount" style="color:var(--text-muted);font-size:13px;"></span>
              </div>
            </div>
          </div>
          <div id="music"></div>
          <div id="storefront"></div>
          <div class="section-title">Posts</div>
          ${postsHtml}
          <div class="brand">Powered by <a href="/">AIAD</a></div>
        `;

        // Instagram-style: clicking any post opens a signup gate.
        ARTIST_NAME = name;
        ARTIST_ID = p.id;
        FOLLOWER_COUNT = Number(p.follower_count) || 0;
        refreshFollow();
        root.querySelectorAll('.post').forEach((el) => el.addEventListener('click', openSignup));

        loadStorefront(p.id, p.username, name);
        loadMusic(p.id);
      }

      // ── Live releases ────────────────────────────────────────────────────────
      // The same shape the in-app profile renders through AIADArtistMusic: releases
      // that are live AND whose aiad_streaming destination is live, then the tracks
      // that finished transcoding. All three tables allow anon SELECT for exactly
      // this content, so the list renders for a signed-out visitor.
      let MUSIC = { audio: null, current: null };

      async function loadMusic(artistId) {
        const host = document.getElementById('music');
        if (!host || !artistId) return;
        const rel = await db.from('releases')
          .select('id,title,release_type,artwork_url,go_live_at,release_destinations!inner(destination,status)')
          .eq('user_id', artistId)
          .eq('status', 'live')
          .eq('release_destinations.destination', 'aiad_streaming')
          .eq('release_destinations.status', 'live')
          .order('go_live_at', { ascending: false });
        // A failed read is not "no music" — say nothing rather than claiming silence.
        if (rel.error) { console.warn('[artist] releases:', rel.error.message); return; }
        const releases = rel.data || [];
        if (!releases.length) return;

        const tr = await db.from('tracks')
          .select('id,title,track_number,duration_seconds,release_id')
          .in('release_id', releases.map((r) => r.id))
          .eq('derivatives_status', 'ready')
          .order('track_number', { ascending: true });
        if (tr.error) { console.warn('[artist] tracks:', tr.error.message); return; }

        const byRelease = {};
        (tr.data || []).forEach((t) => { (byRelease[t.release_id] = byRelease[t.release_id] || []).push(t); });
        // A live release whose tracks are all still transcoding has nothing to play.
        const withTracks = releases.filter((r) => (byRelease[r.id] || []).length);
        if (!withTracks.length) return;

        host.innerHTML = '<div class="section-title">Music</div>' + withTracks.map((r) => {
          const ts = byRelease[r.id];
          const year = r.go_live_at ? new Date(r.go_live_at).getFullYear() : '';
          const art = r.artwork_url
            ? `<img class="rel-art" src="${esc(r.artwork_url)}" alt="" />`
            : '<div class="rel-art"></div>';
          return `<div class="rel">
              <div class="rel-head">${art}
                <div style="min-width:0">
                  <div class="rel-title">${esc(r.title || 'Untitled')}</div>
                  <div class="rel-meta">${esc([r.release_type, year, ts.length + (ts.length === 1 ? ' track' : ' tracks')].filter(Boolean).join(' · '))}</div>
                </div>
              </div>
              ${ts.map((t) => `<div class="trk" id="trk_${esc(t.id)}">
                  <button class="trk-play" data-track="${esc(t.id)}" aria-label="Play ${esc(t.title || '')}">&#9654;</button>
                  <span class="trk-no">${esc(t.track_number == null ? '' : t.track_number)}</span>
                  <span class="trk-title">${esc(t.title || 'Untitled')}</span>
                  <span class="trk-dur">${esc(fmtDur(t.duration_seconds))}</span>
                </div>`).join('')}
            </div>`;
        }).join('') + '<div class="rel-note">Previews are 60 seconds. Full plays are for supporters.</div>';

        host.querySelectorAll('button[data-track]').forEach((b) => {
          b.addEventListener('click', () => playTrack(b.dataset.track, b));
        });
      }

      function fmtDur(s) {
        const n = Number(s);
        if (!Number.isFinite(n) || n <= 0) return '';
        return Math.floor(n / 60) + ':' + String(Math.floor(n % 60)).padStart(2, '0');
      }

      // stream-token is verify_jwt and returns 401 without a user, so a signed-out
      // visitor cannot be handed audio at all — not even a preview. They get the same
      // signup gate the posts use, rather than a play button that fails silently.
      async function playTrack(trackId, btn) {
        const token = storedSession();
        if (!token) return openSignup();

        if (MUSIC.current === trackId && MUSIC.audio && !MUSIC.audio.paused) {
          MUSIC.audio.pause();
          setTrackState(trackId, false);
          return;
        }
        stopMusic();
        btn.disabled = true; btn.innerHTML = '&hellip;';
        try {
          const res = await fetch(`${SUPABASE_URL}/functions/v1/stream-token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },
            // Always preview here: this is a public profile, and a preview needs no
            // pledge, so an unpledged supporter still hears something.
            body: JSON.stringify({ track_id: trackId, source: 'preview' }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            alert(body.error || 'Could not play that right now.');
            return;
          }
          const audio = new Audio(body.url);
          MUSIC.audio = audio; MUSIC.current = trackId;
          // The worker's pre-clipped file starts at 0; an unclipped one needs the
          // client to seek and stop, which is what client_must_clip reports.
          const start = Number(body.preview_start_seconds) || 0;
          const dur = Number(body.preview_duration_seconds) || 60;
          if (body.client_must_clip && start) audio.currentTime = start;
          audio.addEventListener('timeupdate', () => {
            if (body.client_must_clip && audio.currentTime >= start + dur) stopMusic();
          });
          audio.addEventListener('ended', () => stopMusic());
          await audio.play();
          setTrackState(trackId, true);
        } catch (e) {
          console.warn('[artist] play failed:', e);
          alert('Could not play that right now.');
        } finally {
          if (MUSIC.current !== trackId) { btn.disabled = false; btn.innerHTML = '&#9654;'; }
        }
      }

      function setTrackState(trackId, playing) {
        document.querySelectorAll('.trk').forEach((r) => r.classList.remove('playing'));
        document.querySelectorAll('button[data-track]').forEach((b) => { b.disabled = false; b.innerHTML = '&#9654;'; });
        if (!playing) return;
        const row = document.getElementById('trk_' + trackId);
        if (row) row.classList.add('playing');
        const b = document.querySelector(`button[data-track="${trackId}"]`);
        if (b) { b.disabled = false; b.innerHTML = '&#10073;&#10073;'; }
      }

      function stopMusic() {
        if (MUSIC.audio) { try { MUSIC.audio.pause(); } catch (e) {} }
        MUSIC.audio = null;
        const was = MUSIC.current;
        MUSIC.current = null;
        if (was) setTrackState(was, false);
      }

      // Products are anon-readable when is_active (RLS "Public can read active
      // products"), so the storefront needs no extra RPC. Buying does need a
      // session — store-checkout reads auth.uid() to block self-purchase — so a
      // signed-out visitor is sent to sign up rather than into a failing checkout.
      async function loadStorefront(artistId, username, name) {
        const host = document.getElementById('storefront');
        if (!host || !artistId) return;
        let count = 0;
        try {
          const { count: c } = await db.from('products')
            .select('id', { count: 'exact', head: true })
            .eq('artist_id', artistId).eq('is_active', true);
          count = c || 0;
        } catch (e) { return; }
        if (!count) return;
        const label = count === 1 ? '1 item' : count + ' items';
        host.innerHTML =
          `<a class="store-cta" href="/store/${encodeURIComponent(username)}">
             <div>
               <div class="store-cta-eyebrow">Store</div>
               <div class="store-cta-title">Shop ${esc(name)}’s store</div>
               <div class="store-cta-sub">${label} · merch, music &amp; more</div>
             </div>
             <span class="store-cta-btn">Visit store →</span>
           </a>`;
      }

      function fmtMoney(amt, cur) {
        const n = Number(amt);
        if (!Number.isFinite(n)) return '';
        try { return n.toLocaleString(undefined, { style: 'currency', currency: (cur || 'usd').toUpperCase() }); }
        catch (e) { return '$' + n.toFixed(2); }
      }

      // This page's client is deliberately persistSession:false — it's a public page and
      // shouldn't own auth state — so db.auth.getSession() is always null here. Read the
      // app's stored session directly instead. The main app keeps it in localStorage or
      // sessionStorage depending on its "remember me" setting, so check both.
      function fmtFollowers(n) { n = Number(n) || 0; return n === 1 ? '1 follower' : n.toLocaleString() + ' followers'; }
      function updateFollowerCount() { const el = document.getElementById('followerCount'); if (el) el.textContent = fmtFollowers(FOLLOWER_COUNT); }
      function setFollowBtn(following) {
        const b = document.getElementById('followBtn'); if (!b) return;
        b.dataset.following = following ? '1' : '0';
        b.textContent = following ? 'Following' : 'Follow';
        if (following) { b.style.background = 'transparent'; b.style.color = 'var(--text-primary)'; b.style.border = '1px solid var(--border-default)'; }
        else { b.style.background = 'linear-gradient(135deg,var(--teal-light),var(--teal-dark))'; b.style.color = '#001018'; b.style.border = 'none'; }
      }
      function jwtSub(t) { try { return JSON.parse(atob(t.split('.')[1])).sub; } catch (e) { return null; } }
      async function refreshFollow() {
        updateFollowerCount();
        if (!storedSession()) { setFollowBtn(false); return; }
        try {
          const { data } = await db.rpc('is_following', { p_artist: ARTIST_ID });
          setFollowBtn(!!data);
        } catch (e) { setFollowBtn(false); }
      }
      window.toggleFollow = async function (btn) {
        if (!storedSession()) { openSignup(); return; }
        const following = btn.dataset.following === '1';
        btn.disabled = true;
        try {
          const { data, error } = await db.rpc('set_follow', { p_artist: ARTIST_ID, p_state: !following });
          if (error) throw error;
          const nowFollowing = !!data;
          setFollowBtn(nowFollowing);
          FOLLOWER_COUNT = Math.max(0, FOLLOWER_COUNT + (nowFollowing ? 1 : -1));
          updateFollowerCount();
        } catch (e) { alert('Could not update follow'); }
        btn.disabled = false;
      };
      function storedSession() {
        const key = 'sb-uapiytquwuhtewqieegx-auth-token';
        for (const store of [window.localStorage, window.sessionStorage]) {
          try {
            const raw = store.getItem(key);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            const token = parsed?.access_token || parsed?.currentSession?.access_token;
            if (token) return token;
          } catch (e) {}
        }
        return null;
      }

      async function buyProduct(productId, btn) {
        // store-checkout reads auth.uid() to price the order and block self-purchase,
        // so an anonymous visitor is sent to sign up rather than into a failing call.
        const token = storedSession();
        if (!token) { window.location.href = '/'; return; }
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = 'Opening checkout…';
        try {
          const res = await fetch(`${SUPABASE_URL}/functions/v1/store-checkout`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`,
              'apikey': SUPABASE_ANON_KEY,
            },
            body: JSON.stringify({ product_id: productId, quantity: 1 }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Checkout failed (${res.status})`);
          if (!data.url) throw new Error('No checkout link returned');
          window.location.href = data.url;
        } catch (e) {
          alert(e.message);
          btn.disabled = false; btn.textContent = orig;
        }
      }

      function notFound(username) {
        document.getElementById('root').innerHTML =
          `<div class="state">No artist found at <strong>@${esc(username)}</strong>.<br/><br/>
           <a href="/" style="color:var(--teal-light)">← Back to AIAD</a></div>`;
      }

      (async function () {
        const username = getUsername();
        if (!username) return notFound('');
        try {
          const { data, error } = await db.rpc('public_artist_profile', { p_username: username });
          if (error || !data) return notFound(username);
          render(data);
        } catch (e) { notFound(username); }
      })();
    </script>
</body>
</html>
